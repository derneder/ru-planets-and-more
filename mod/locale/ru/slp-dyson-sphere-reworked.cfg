; ИСПРАВЛЕНИЕ: фамилия Дайсон с заглавной; убран двойной пробел.
slp-ds-planet-satellite=Строит сеть, что ловит энергию от Сферы Дайсона на орбите и отправляет на поверхность. Запустите на орбите или любую платформу для добавления к орбите (на платформу ничего не придет). Для постройки требуется: Наувис - 500, Вулканус - 300, Глеба - 500, Фульгора - 1000, Аквило - 100

