ds-entangled-core=Пучок запутанных частиц в магнитном поле. Позволяет передавать энергию сквозь большие расстояния, однако плохо работает в атмосферах планет
; ИСПРАВЛЕНИЕ: "для автоматической отправке" -> "отправки".
