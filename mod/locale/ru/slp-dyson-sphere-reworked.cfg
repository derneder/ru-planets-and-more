; Перевод мода полный и сделан его автором. Здесь только исправления —
; орфография, согласование и одно потерянное предложение. Всё остальное
; не трогаем: работа автора не дублируется.

; БЕЗЫМЯННАЯ СЕКЦИЯ: два ключа ниже в оригинале лежат ДО первого заголовка,
; то есть в безымянной секции. Перекрыть их можно только так же, поэтому
; порядок здесь важен: любой [заголовок] выше сломал бы перекрытие.

; ИСПРАВЛЕНИЕ: "Нэвис" — планета называется Наувис, как в ванильной локализации
; и как в остальных строках этого же файла ("Наувис - 500").
ds-no-sun=Спутники полностью перекрыли звезду, свет более не попадает на Наувис!

; ИСПРАВЛЕНИЕ: "Все Энергитический приемники" — опечатка и несогласованность.
plst-done=Ретранслятор на планете __1__ установлен! Все энергетические приемники на поверхности активны! Дальнейший запуск ретрансляторов не будет давать эффекта!

; ИСПРАВЛЕНИЕ: пропущено предложение оригинала "Make dyson sphere near star
; and forget about other energy sources in planets and in space!".
[mod-description]
slp-dyson-sphere-reworked=Кому нужен термоядерный реактор, когда у вас есть целая звезда? Отправляйтесь прямо на орбиту светила и переправляйте тонны энергии туда, где она необходима, с помощью новых технологий. Главное — не забудьте покинуть корабль перед вылетом! Постройте сферу Дайсона у звезды и забудьте о других источниках энергии на планетах и в космосе! Этот мод необходим для любых SLP модов (или же вы можете попробовать генерировать столько энергии самостоятельно, желаю удачи с этим)

; ИСПРАВЛЕНИЕ: "Энергитический" -> "Энергетический" во всех названиях приёмника.
