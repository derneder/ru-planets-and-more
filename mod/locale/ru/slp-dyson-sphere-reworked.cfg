slp-dyson-sphere-grounded=Открытие лития позволило создать направленный пучок связи! Теперь мы можем сделать ретранслятор, что будет передавать энергию Сферы Дайсона на поверхность планет!
; ИСПРАВЛЕНИЕ: "бешенная" -> "бешеная".
slp-fuel-mk2=Всего 40 минут? А как насчет пары столетий?! Всего немного серы при нулевой гравитации и бешеная плазма готова работать еще очень долго!
