page_eneas_text_1=Всем, кто играет в этот мод
page_eneas_text_2=Огромное спасибо, что решили попробовать Энеас! Если у вас есть отзывы, идеи или критика — смело пишите мне через портал модов или на Discord-сервере Foundry. Хотя Энеас уже официально вышел, я по-прежнему активно работаю над модом и улучшаю его. Весь основной контент и механики на месте, но шероховатостей ещё хватает.
page_eneas_text_3=Оговорка
page_eneas_text_4=Кое-что в этом моде всё ещё не закончено. У некоторых зданий нет нормальной анимации. Также есть незавершённые страницы Информатрона.

page_unit_text_1=Юнит-05
page_unit_text_2=Содержимое скоро появится!
page_unit_text_3=\nЮнит-05
page_unit_text_4=Содержимое скоро появится!

page_pollution_text_1=Загрязнение
page_pollution_text_2=Каждый цикл (15 минут) из обширных недр Энеаса на поверхность [entity=eneas-vent] выбрасывается переменное количество загрязнения. Давным-давно Энеас справлялся с этим сам, но те времена прошли. Убирать загрязнение на Энеасе можно с помощью некоторых новых зданий — например, [entity=clarifier] Осветлителя.\n\n Проверка уровня загрязнения происходит до того, как в следующем цикле добавится новое. Если загрязнение слишком велико, [entity=unit-05] юнит-05 будет отключён до конца цикла. Снижение загрязнения снова позволит юниту-05 работать.
page_pollution_text_3=\nЖёрла
page_pollution_text_4=Сами жёрла — лишь выход для загрязнения. Если вам каким-то образом удастся их разрушить ([color=yellow][entity=unit-05] если получится — обязательно расскажите мне, как! [/color]), загрязнение просто начнёт распространяться из случайных точек карты. Вместо этого рекомендуется строить здания, поглощающие загрязнение, рядом с жёрлами — там всегда будут самые грязные участки. Проверка учитывает суммарное загрязнение по всем участкам, а не по каким-то конкретным.


page_generator_text_1=Генератор
page_generator_text_2=Содержимое скоро появится!
page_generator_text_3=\nГенератор
page_generator_text_4=Содержимое скоро появится!

page_lift_text_1=Подъёмник
page_lift_text_2=[entity=eneas-lift] Подъёмник — один из последних уцелевших входов в производственные цеха в недрах Энеаса. С его помощью [entity=unit-05] юнит-05 может каждый цикл (15 минут) снабжать вас ресурсами на Энеасе. По умолчанию он производит базовые ресурсы Энеаса: [item=ancient-circuit] древние схемы, [item=ancient-frame] древние каркасы и [item=ancient-material] древний материал.
page_lift_text_3=\nВыработка
page_lift_text_4=Увеличить объём этих поставок можно двумя способами. Во-первых, снизив уровень загрязнения на Энеасе: когда поверхность чиста, юнит-05 лучше сосредотачивается и может произвести для вас больше ресурсов. Во-вторых, можно исследовать новые технологии, которые увеличивают как общее количество производимых ресурсов, так и добавляют в набор новые предметы.

page_unit_07_text_1=Юнит-07
page_unit_07_text_2=Содержимое скоро появится!
page_unit_07_text_3=\nЮнит-07
page_unit_07_text_4=Содержимое скоро появится!

page_artifact_text_1=Ветхие артефакты
page_artifact_text_2=Останки древних технологий. Даже в изношенном состоянии [item=eneas-artifact] артефакты всё ещё
page_artifact_text_3=\nВетхие артефакты
page_artifact_text_4=Содержимое скоро появится!

page_debris_text_1=Падение обломков
page_debris_text_2=Похоже, [planet=eneas] луна над Наувисом нестабильна и постоянно теряет материал, который падает на поверхность её [planet=nauvis] соседа. Оба небесных тела, судя по всему, находятся в приливном захвате, из-за чего падения сосредоточены в одной и той же области.\n
page_debris_text_3=[color=yellow][entity=unit-05] Метки обломков на карте могут раздражать. Но не переживайте! Они автоматически убираются каждые 15 минут, если рядом с ними не осталось обломков. [/color]
page_debris_text_4=\nСокровища
page_debris_text_5=Хотя куски [item=eneas-artifact] древних механизмов, которые удаётся извлечь из обломков, уже сами по себе ценны, среди них скрыта и куда более полезная добыча.\nЧтобы её отыскать, нужны сноровка и точность, на которые способен только сам инженер. Автоматическая разборка обломков [item=construction-robot] роботами даст лишь базовые ресурсы, без шанса на редкую находку.\n

page_data_text_1=Данные
page_data_text_2=Содержимое скоро появится!
page_data_text_3=\nДанные
page_data_text_4=Содержимое скоро появится!

page_radar_text_1=Радар
page_radar_text_2=Продвинутый радар способен автоматизировать снос сущностей. Отправляя ему сигнал по проводу, вы задаёте цели для сноса. Например, выбрав сигнал [entity=debris-a] крупных обломков, вы прикажете радару отдавать приказ на снос этой сущности в пределах своего радиуса. Одному радару можно задать сразу много целей. \n\n ([color=yellow][entity=unit-05] Будьте осторожны, подключая радар к крупным цепям — он может снести часть вашей базы! [/color])
page_radar_text_3=Предметы на земле
page_radar_text_4=Радару также можно поручить убирать предметы, лежащие на земле. Различать разные предметы на земле он не умеет. Просто передайте радару сигнал [virtual-signal=signal-mining] добычи, и он разберётся со всеми.
