[mod-setting-description]
abacayba_height=Ни в коем случае не меняйте это значение в текущем сохранении! Ваш ленточный мир будет обрезан. Меньшие значения = сложность растёт экспоненциально. Если хотите изменить Абакайбу, удалите мод (прогресс на Абакайбе будет потерян), сохранитесь, установите мод заново и задайте новые настройки.
abacayba_wave=Ни в коем случае не меняйте это значение в текущем сохранении! Ваш ленточный мир будет обрезан. Большие значения = сложность растёт экспоненциально. Если хотите изменить Абакайбу, удалите мод (прогресс на Абакайбе будет потерян), сохранитесь, установите мод заново и задайте новые настройки.
