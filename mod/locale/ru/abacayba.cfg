abacayba_plants=Деревья Абакайбы
abacayba_ruins=Руины Абакайбы
abacayba_enemy_base=Базы врагов Абакайбы

[entity-description]
abacayba_huge_mining_drill_entity=Экзотическая буровая размером с городской квартал с огромной областью добычи. Способна добывать более твёрдые руды и минералы.
abacayba_rotary_trommel_entity=Экзотическая вращающаяся наклонная цилиндрическая машина. Разрушает мягкие примеси в руде за счёт водяного орошения и абразивного перемешивания. Богатые водой минералы дают грязную воду.
abacayba_rotary_calciner_entity=Экзотический вращающийся наклонный цилиндр для непрерывного нагрева сырья до высоких температур: вызывает химическое разложение, активирует или восстанавливает отработанные катализаторы, изменяет фазовое состояние или удаляет влагу.
abacayba_thickener_sedimentation_entity=Экзотический вертикальный отстойник с непрерывным гравитационным процессом, отделяющий взвешенные твёрдые частицы от жидкости и дающий плотный шлам и осветлённую жидкость.
abacayba_itaverax_ultracapacitor_entity=Экзотический аккумулятор сверхвысокой ёмкости.

abacayba-itaverax-sassy-wriggler-pentapod-premature=Дружелюбные извиватели, насыщенные итавераксом. Не следуют за игроком, но атакуют любых врагов, оказавшихся в радиусе действия, пока не истечёт срок их жизни.
abacayba_glowing_one_biter=Босс Абакайбы! Сверхмедленный танк ближнего боя с дальней атакой и огромной областью поражения.
abacayba_pillar=Босс Абакайбы! Сверхмедленный летающий танк ближнего боя с дальней атакой и областью поражения размером с континент.

