[item-description]
abacayba_itaverax_ore=Экзотический богатый водой минерал, который можно активировать в высокоэффективные материалы.
abacayba_torbernite_ore=Богатый водой радиоактивный минерал, который можно разложить на составляющие металлы.
itaverax-rail=Служит для ручной постройки неразрушимых прямых рельсов или для постройки через планировщик рельсов.\n__CONTROL__build__ — построить короткий путь напрямую.\n__CONTROL__build-ghost__ — разместить длинный призрачный путь.
abacayba_itaverax_pentapod_egg=Дружелюбные извиватели, насыщенные итавераксом. Не следуют за игроком, но атакуют любых врагов, оказавшихся в радиусе действия, пока не истечёт срок их жизни.
abacayba_itaverax_sassy_wriggler_capsule=Дружелюбные извиватели, насыщенные итавераксом. Не следуют за игроком, но атакуют любых врагов, оказавшихся в радиусе действия, пока не истечёт срок их жизни.
abacayba_infested_personal_roboport_equipment=Заражённый робопорт обладает всеми свойствами личного робопорта и при наличии питания способен автоматически помечать предметы на земле для сноса в радиусе строительства. Он может помечать даже мёртвые тела, такие как [entity=abacayba-itaverax-stomper-shell], [entity=abacayba_itaverax_skull], [entity=abacayba_itaverax_cortex] и [entity=abacayba_pillar_shell].
abacayba_cyst_capsule=Жуткая капсула с вражескими цистами, порождающая кошмары Абакайбы.

