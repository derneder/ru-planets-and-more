[space-location-name]
abacayba=Абакайба

[space-location-description]
abacayba=Живая заражённая планета, покрытая океанами враждебных местных видов и мощных ресурсов. Высадитесь на одном из её отростков и пробейтесь к ядру планеты. Здесь сохранились руины развитой цивилизации, без которых, судя по всему, это место не приручить: экзотические технологии позволяют перерабатывать богатые водой минералы в самые разнообразные элементы и исполинские машины.

