[technology-description]
planet_discovery_abacayba=Живая заражённая планета, покрытая океанами враждебных местных видов и мощных ресурсов. Высадитесь на одном из её отростков и пробейтесь к ядру планеты. Здесь сохранились руины развитой цивилизации, без которых, судя по всему, это место не приручить: экзотические технологии позволяют перерабатывать богатые водой минералы в самые разнообразные элементы и исполинские машины.
abacayba_look_for_technologies=Поиск экзотических руин. Открывает доступ к давно утраченным технологиям переработки руды.
abacayba_oozing_white_goo_tech=Сочащуюся белую слизь можно сжечь до состояния угля.
abacayba_crystal_washing=Позволяет промывать кристаллические руды. Сильно гидратированные минералы при этом высвобождают воду.
abacayba_crystal_kiln=Точный нагрев материалов до высоких температур для разложения, окисления или восстановления. Позволяет очистить или упрочнить материал окислением либо подготовить каталитическую поверхность. Изменяет химическую природу материала.
abacayba_crystal_sedimentation=Позволяет взвешенным частицам оседать из грязной воды по мере её медленного протекания через резервуар. На дне может образовываться слой скопившихся рудных твёрдых частиц.
abacayba_itaverax_alloy_tech=Позволяет создавать сплав итаверакса — упрочнённый твёрдый раствор металлов, соединённых на атомном уровне.
abacayba_itaverax_coil_tech=Позволяет создавать катушку итаверакса и получать невероятно высокое напряжение.
abacayba_itaverax_polymer_tech=Позволяет создавать полимер итаверакса — трёхмерную устойчивую сшитую сеть из очень крупных молекул.
abacayba_itaverax_composite_tech=Позволяет создавать композит итаверакса — сверхтвёрдую жаростойкую пластину из склеенных слоёв.
abacayba_itaverax_electromagnet_tech=Позволяет создавать электромагнит итаверакса — магнит, магнитное поле которого создаётся электрическим током.
abacayba_itaverax_cpu_tech=Позволяет создавать центральный процессор итаверакса — сверхбыстрый вычислитель, выполняющий инструкции по определённому циклу: выборка, декодирование, исполнение, повтор.
abacayba_itaverax_superconductor_tech=Позволяет создавать сверхпроводник итаверакса комнатной температуры — сверхэкзотический материал с нулевым электрическим сопротивлением, вытесняющий магнитные поля при любой температуре.
abacayba_ominous_science_pack_tech=Продолжайте изучать экзотическую усиливающую мощь кристаллов итаверакса.
abacayba_advanced_oozing_white_goo_processing_tech=Очистка сочащейся белой слизи для производства руд, молока, пластмасс, серы и топлива. А также улучшенная работа с жидкостями.
abacayba_itaverax_ultracapacitor_tech=Экзотическое здание, накапливающее огромные объёмы электроэнергии для последующего использования. Итаверакс — чрезвычайно энергоёмкий кристалл с чистой ядерной энергией, которую можно усилить.
itaverax_rail_tech=Рельсы из крайне плотного металлического сплава, невосприимчивого к физическому урону.
itaverax_xenobiology_tech=Синтетическая биология, направленная на управление биологическими системами силами итаверакса.
abacayba_itaverax_sassy_wriggler_capsule_tech=Непортящаяся одомашненная внеземная жизнь, которая не следует за игроком, но атакует любых врагов, оказавшихся в радиусе действия.
abacayba_infested_personal_roboport_tech=Заражённый робопорт, обладающий всеми свойствами личного робопорта и способный при наличии питания автоматически помечать предметы на земле для сноса в радиусе строительства.
abacayba_cyst_capsule_tech=Обратная биоинженерия цист Абакайбы, стабилизированных силами итаверакса.
abacayba_biomimetic_calcination=Точный нагрев затвердевших внеземных материалов. Сложные системы органов при этом всё равно утрачиваются, сохраняются лишь базовые структурные клетки.
abacayba_pure_water_calcination_tech=Термическая обработка для испарения кристаллизационной воды. При термическом разложении может образоваться кальцит.
abacayba_calcite_flotation_tech=Отделяет вольфрамовую руду от пустой породы за счёт различий в химии поверхности.
abacayba_stone_flotation_tech=Отделяет руды от пустой породы за счёт различий в химии поверхности.
abacayba_torbernite_productivity=Повышенный выход при производстве торбернита.
abacayba_itaverax_productivity=Повышенный выход при производстве итаверакса.
abacayba_dirty_water_sed_productivity=Повышенный выход при производстве грязной воды.
abacayba_oozing_white_goo_productivity=Повышенный выход при производстве сочащейся белой слизи.
abacayba_milk_productivity=Повышенный выход при производстве молока Абакайбы.
abacayba_mining_productivity=Дополнительно повышенный выход со всех буровых станков и нефтекачалок.
abacayba_research_productivity=Дополнительный объём прогресса исследований за каждый потреблённый исследовательский пакет.
; Добавлено по Abacayba 0.0.39 — строк не было ни у автора, ни у нас.
abacayba_character_itaverax_bonus=Нездоровая пища, сильнейшее тело. Побочные эффекты: -ДАННЫЕ УДАЛЕНЫ-.

