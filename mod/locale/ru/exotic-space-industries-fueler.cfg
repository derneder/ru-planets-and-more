[entity-name]
ei_fueler=Автоматическая заправочная башня

[item-description]
ei_fueler=Автоматическая [color=orange]заправочная башня[/color]. Может заправлять поезда, автомобили и танки, а также их [color=blue]сетки экипировки[/color] и слоты боеприпасов турелей. Подробнее — во внутриигровой энциклопедии Информатрон.

[mod-setting-name]
ei_fueler_max_updates_per_tick=Макс. обновлений заправщика за тик
ei_fueler_range=Радиус действия заправочной башни

[mod-setting-description]
ei_fueler_max_updates_per_tick=Количество обновлений за тик. Заправочные башни обновляются по циклу. Чем больше это число, тем больше башен будет обновляться за меньшее время. Однако производительность снизится. Если башни используются только для заправки неподвижных целей, стандартного значения достаточно.
ei_fueler_range=Больший радиус позволяет находить цели на большем расстоянии. Однако производительность снизится, так как башням придётся сканировать большую площадь.

[technology-name]
ei_fueler=Заправочная башня

[technology-description]
ei_fueler=Заправочные башни могут заправлять транспорт, паукотронов, поезда, а также сетки экипировки транспорта и игрока в радиусе своего действия. Заправочная башня передаёт предметы из своего инвентаря в топливные инвентари поблизости. За раз можно заправлять только один тип целей. Тип цели задаётся в окне, которое открывается по щелчку на башне. Можно выбрать заправку либо потребителей в сетках экипировки, либо самого транспорта. Башня также заберёт всё отработанное топливо и по возможности сохранит его в своём инвентаре.

[exotic-industries-fueler]
fueler-gui-title=Консоль
fueler-gui-control-title=Управление
fueler-gui-control-description=[font=default-bold]Тип цели[/font] [img=info]
fueler-gui-control-description-tooltip=Выберите тип целей, которые будет заправлять башня. Поезда из других модов поддерживаются типом «локомотив». Автомобили и танки из других модов — типом «автомобиль». То же касается всех видов паукотронов.
fueler-gui-equipment-description=[font=default-bold]Назначение топлива[/font] [img=info]
fueler-gui-equipment-description-tooltip=Должна ли эта башня заправлять сам транспорт или его сетки экипировки?

vehicle=Только транспорт
equipment=Только сетки экипировки

[exotic-industries-fueler-informatron]
menu_exotic-industries-fueler-informatron=Заправочная башня
title_exotic-industries-fueler-informatron=Заправочная башня

welcome=Exotic Industries: заправщик
welcome-text=Заправочная башня — машина, способная заправлять транспорт, паукотронов, поезда, а также сетки экипировки транспорта и игрока в радиусе своего действия. Заправочная башня передаёт предметы из своего инвентаря в топливные инвентари поблизости. За раз можно заправлять только один тип целей. Тип цели задаётся в окне, которое открывается по щелчку на башне. Можно выбрать заправку либо потребителей в сетках экипировки, либо самого транспорта. Башня также заберёт всё отработанное топливо и по возможности сохранит его в своём инвентаре.

welcome-text-2=Эти башни могут заправлять и движущиеся цели, например идущие поезда. Влияние мода на производительность не зависит от количества размещённых башен — вместо этого снижается частота их обновления. Частоту обновления и радиус действия башен можно изменить в настройках мода. Стандартных настроек достаточно для всех неподвижных целей. Если цели движутся, а башен много, башня может не успеть заправить проходящий мимо поезд.
