; ============================================================
; ИСПРАВЛЕНИЯ существующего перевода мода (сверка со всеми строками EN)
; ============================================================

; ИСПРАВЛЕНИЕ: проценты ветеранства турелей приведены к версии мода 2.9.2 —
; в ней автор уполовинил бонусы (Hard стал +2.5% вместо +5% и т. д.), а русский
; перевод внутри мода остался от 2.7.7 и показывает вдвое большие цифры.
; Целевой считаем более новую версию. ВНИМАНИЕ: на установленной 2.7.7 наши
; строки, наоборот, занизят числа вдвое — расхождение уйдёт после обновления мода.
; Запятая в «+2,5%» — русская десятичная, не ошибка; audit.py на неё ругается всегда.
[string-mod-setting]
settings-turrets-vet-bonus-increase-half=Сложно (+2,5%)
settings-turrets-vet-bonus-increase-default=По умолчанию (+5%)
settings-turrets-vet-bonus-increase-double=Легко (+10%)

[string-mod-setting-description]
settings-turrets-vet-bonus-increase-half=Тир 1 -> +2,5%\nТир 2 -> +5%\nТир 3 -> +7,5%\nТир 4 -> +12,5%
settings-turrets-vet-bonus-increase-default=Тир 1 -> +5%\nТир 2 -> +10%\nТир 3 -> +15%\nТир 4 -> +25%
settings-turrets-vet-bonus-increase-double=Тир 1 -> +10%\nТир 2 -> +20%\nТир 3 -> +30%\nТир 4 -> +50%


