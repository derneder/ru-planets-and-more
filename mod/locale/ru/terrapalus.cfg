[mod-name]
terrapalus=○ Терра Палус

[mod-description]
terrapalus=Добавляет новую гибридную планету, сочетающую черты Наувиса и Глебы. Отважьтесь высадиться на опасной болотной луне Терра Палус — добывайте руду пулузия и используйте ультрафиолетовый свет, чтобы замораживать тех, кто хочет вас уничтожить.
