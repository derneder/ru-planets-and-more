[dialogue.tech.planet-discovery-eneas]
line-01=[color=green][ВХОДЯЩАЯ ПЕРЕДАЧА][/color]
line-02=[color=yellow][img=entity/unit-05]: У меня очень серьёзная просьба. Моё ядро памяти сильно повреждено, пробелов так много, что трудно сосредоточиться, с чего начать.[/color]
line-03=[color=yellow][img=entity/unit-05]:Это выходит за пределы моих возможностей самовосстановления. Мне нужен кто-то, кто будет подавать мне внешние пакеты данных, чтобы я мог восстановить повреждённые фрагменты.[/color]
line-04=[color=yellow][img=entity/unit-05]:Изготавливать их придётся прямо здесь, на месте, на Энеасе, так что.. учитывая, что вы сейчас единственный, кого я знаю..[/color]
line-05=[color=red][img=entity/unit-05-dummy] ПОМОГИТЕ, ЛАДНО? Пожалуйста? [/color]
line-06=[color=gray]Страница Информатрона открыта![/color]

[dialogue.tech.ambition-science-pack]
line-01=[color=green][ВХОДЯЩАЯ ПЕРЕДАЧА][/color]
line-02=[color=yellow][img=entity/unit-05]: Я вижу их, они говорят обо мне. Кто это?[/color]
line-03=[color=yellow][img=entity/unit-05]: Предназначение — вот для чего меня создали. Но каким оно было?[/color]
line-04=[color=red][img=entity/unit-05-dummy]: БЕССМЫСЛЕННЫЕ ВОПРОСЫ [/color]
line-05=[color=gray]Страница Информатрона открыта![/color]

[dialogue.tech.codex-tech]
line-01=[color=green][ВХОДЯЩАЯ ПЕРЕДАЧА][/color]
line-02=[color=yellow][img=entity/unit-05]: Да, теперь я вспоминаю.. Отец. Один из этих двоих — мой создатель. Другой.. значит, его брат. Они всегда пререкались.[/color]
line-03=[color=yellow][img=entity/unit-05]: У отца была слабость к нему. Сколько бы раз тот ни переходил границы, отец всегда его прощал..[/color]
line-04=[color=red][img=entity/unit-05-dummy]: ОН ХУЖЕ ВСЕХ[/color]
line-05=[color=gray]Страница Информатрона открыта![/color]

[dialogue.tech.artifact-drilling]
line-01=[color=green][ВХОДЯЩАЯ ПЕРЕДАЧА][/color]
line-02=[color=yellow][img=entity/unit-05]: Энеас? Честно говоря, он в плачевном состоянии. Прошло много времени, и в какой-то момент всё начало разваливаться. Я не был рассчитан на такой срок. [/color]
line-03=[color=yellow][img=entity/unit-05]: Кстати, а для чего его построили? Я помню людей, их дома. Зачем они здесь были? Что случилось с Фульгорой? [/color]

[dialogue.tech.pyrolysis-tech-basic]
line-01=[color=green][ВХОДЯЩАЯ ПЕРЕДАЧА][/color]
line-02=[color=yellow][img=entity/unit-05]: Настоятельно советую внимательно присмотреться к загрязнению, которое вы производите. Оболочка Энеаса и без того забита им под завязку — ещё немного, и я не смогу функционировать. [/color]
line-03=[color=yellow][img=entity/unit-05]: Можете посадить побольше деревьев, если хотите помочь. [/color]

[dialogue.tech.lurker-tech]
line-01=[color=green][ВХОДЯЩАЯ ПЕРЕДАЧА][/color]
line-02=[color=yellow][img=entity/unit-05]: Как я мог забыть о тебе, старый друг. Ты всё это время был прямо передо мной?[/color]
line-03=[color=yellow][img=entity/unit-05]: Пожалуйста, позаботьтесь о номере 7. [/color]
line-04=[color=gray]Страница Информатрона открыта![/color]

[dialogue.tech.oil-tech]
