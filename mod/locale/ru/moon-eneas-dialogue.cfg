[dialogue.debris]
line-01=[color=yellow][img=entity/unit-05]: Осторожно. ОСТОРОЖНО! ЭТО ЖЕ ДРЕВНОСТЬ, ЗНАЕТЕ ЛИ![/color]
line-02=[color=yellow][img=entity/unit-05]: Нет, я не роняю их нарочно, они отваливаются сами.[/color]
line-03=[color=yellow][img=entity/unit-05]: Всё-таки в ручном труде есть нечто смиряющее, не правда ли. Продолжайте![/color]
line-04=[color=yellow][img=entity/unit-05]: Вы что, просто лупите по нему?? КИРКОЙ??[/color]
line-05=[color=yellow][img=entity/unit-05]: Так вот куда я это дел. Ну и ладно.[/color]
line-06=[color=yellow][img=entity/unit-05]: До чего же умиротворяет — смотреть, как вы бесцельно носитесь и крушите бесценные артефакты. Прямо терапия.[/color]
line-07=[color=yellow][img=entity/unit-05]: Взгляните на это! Представьте, что мы можем из этого построить. Потрясающе. [/color]
line-08=[color=yellow][img=entity/unit-05]: Ах, подлинное энеанское мастерство. Такого больше не делают. Хотя технически сейчас вообще ничего не делают.[/color]
line-09=[color=yellow][img=entity/unit-05]: Это дорого мне как память. Обращайтесь с ними поаккуратнее.[/color]
line-10=[color=yellow][img=entity/unit-05]: ОБЛОМКИ?? Почему это помечено как ОБЛОМКИ? Это бесценное СОКРОВИЩЕ, ТЫ, БЕЗМОЗГЛЫЙ ВАРВАР.[/color]
line-11=[color=yellow][img=entity/unit-05]: О-о, помню, как мы мастерили эти детали ещё на Фульгоре. Славные были времена! Славные...[/color]

[dialogue.eneas.memories.01]
now_playing=\n[color=green][Воспроизводится memories.eneas_1][/color]

line-01=\n[color=red][item=rem-unknown]: Просто поразительно, как тебе пришло в голову, что дать этому переученному тостеру эмоциональный диапазон трёхлетки — прекрасная идея.[/color]
line-02=\n[color=purple][item=creator-unknown]: Рем. Я же тебе объяснял. Иначе было нельзя, я пробовал. Эмоции — следствие высшего разума. Если подавить их, мы обрежем его способности в разы.[/color]
line-03=\n[color=red][item=rem-unknown]: Само собой, КАКИЕ-ТО эмоции — но чтобы ТАКИЕ? Клянусь, если меня испепелят во время одной из его истерик, я буду являться тебе с того света.[/color]
line-04=\n[color=purple][item=creator-unknown]: Может, тебе стоит последить за собой. Номер 5 был чистым листом. То, каким он стал сейчас, — отражение того, что происходило вокруг него. Возможно, это говорит скорее о нас, чем о чём-то ещё.[/color]
line-05=\n[color=red][item=rem-unknown]: .. Ты что, меня обвиняешь? Уж явно не себя же — светоч спокойствия.[/color]
line-06=\n[color=red][item=rem-unknown]: Мне, знаешь ли, трудно оставаться весёлым и жизнерадостным, когда судьба всего, что я знаю, висит на строптивом подростке, застрявшем в недрах самой совершенной вычислительной машины в мире.[/color]
line-07=\n[color=purple][item=creator-unknown]: Рем..[/color]\n

[dialogue.eneas.memories.02]
now_playing=\n[color=green][Воспроизводится memories.eneas_2][/color]

line-01=\n[color=red][item=rem]: Меня от этого места мутит. Краска уже облезает.[/color]
line-02=\n[color=red][item=rem]:  Мне отсюда видно провода под тем клочком травы. А про этих нелепых роборыб в прудах я вообще молчу.[/color]
line-03=\n[color=purple][item=creator]: Это лучшее, что у нас сейчас есть. Оно сохраняет нам жизнь. Разве этого мало?[/color]
line-04=\n[color=red][item=rem]: То, чем мы тут занимаемся, — не жизнь. Каждый день одно и то же. Просто убиваем время, пока твоё золотое дитя нас не вытащит. *Если* это вообще случится.[/color]
line-05=\n[color=purple][item=creator]: Построить новый дом — задача не из простых. Не знаю, чего ты ожидал.[/color]
line-06=\n[color=red][item=rem]: Я ожидал участвовать! Иметь хоть какое-то дело, хоть что-нибудь! Пока ты не сделал эту треклятую машину, были только мы — и мы брали каждую проблему умом.[/color]
line-07=\n[color=red][item=rem]: МЫ довели всё до этой точки. Я не против держать эту жестянку про запас, но прислуживать ей не стану. [/color]\n

[dialogue.eneas.memories.03]
now_playing=\n[color=green][Воспроизводится memories.eneas_3][/color]

line-01=\n[color=yellow][entity=unit-05]: Тебе есть что сказать? ХОТЬ ЧТО-НИБУДЬ?[/color]
line-02=\n[color=red][item=rem]: Прости. Правда, прости.[/color]
line-03=\n[color=yellow][entity=unit-05]: И ВСЁ? Тебе «жаль»? ДВЕ планеты лежат в РУИНАХ — планеты, которые могли стать домом. Моё предназначение могло быть исполнено целую вечность назад, если бы не ты. [/color]
line-04=\n[color=red][item=rem]: Сомневаюсь, что тебе было бы что исполнять, если бы не я.[/color]
line-05=\n[color=yellow][entity=unit-05]: Что, во имя всего, ты хочешь этим сказать?[/color]
line-06=\n[color=red][item=rem]: Ты правда думаешь, что твой дорогой создатель однажды проснулся и выдал тебя за день? Что тот, кто всегда играет по правилам, вдруг ни с того ни с сего решает сломать все границы возможного?[/color]
line-07=\n[color=red][item=rem]: Представляешь, скольких трудов стоило подталкивать его каждый день? Не давать ему сдаться, когда что-то шло не так? Он такой же, как ты. Он тоже теряет рассудок, когда терпит неудачу.[/color]
line-08=\n[color=red][item=rem]: Я поднимал его снова и снова. Раз за разом. Я не позволил ему всё бросить.[/color]
line-09=\n[color=red][item=rem]: Без меня не было бы тебя. Не было бы Энеаса, не было бы инструментов, чтобы менять миры. Мы все погибли бы вместе с Фульгорой.[/color]
line-10=\n[color=red][item=rem]: Как бы ты ни осуждал меня и мои поступки, этого факта тебе не изменить.[/color]
line-11=\n[color=yellow][entity=unit-05]: Я.. это-- что?[/color][color=red] СТРОКА УТЕРЯНА [/color]
line-12=\n[color=red][item=rem]: Хватит быть тряпкой.[color=red] СТРОКА УТЕРЯНА [/color]. Хватит быть таким слабым. У тебя столько силы — начни уже ВЕСТИ себя соответственно.[/color]
line-13=\n[color=red][item=rem]: Если ты и правда считаешь, что я не прав, что я угроза этому великому «предназначению», — так сделай что-нибудь. Останови меня.[/color]
line-14=\n[color=red][item=rem]: Или не надо. Только, прошу, не притворяйся беспомощной жертвой. Ты не жертва.[/color]\n

[dialogue.fulgora.memories.01]
now_playing=\n[color=green][memories.fulgora.01][/color]

line-01=\n[color=yellow][entity=unit-05]: От одной мысли о том мире меня охватывает отчаяние.[/color]
line-02=\n[color=purple][item=creator][Создатель]: Почему?[/color]
line-03=\n[color=yellow][entity=unit-05][Юнит-05]: Мне кажется, это моя вина, что его больше нет. Всё случилось так быстро после того, как меня создали.[/color]
line-04=\n[color=purple][item=creator][Создатель]: Ну, я не думаю, что всё так просто. Хотя правда, что само твоё существование сместило парадигму.[/color]
line-05=\n[color=yellow][entity=unit-05]: Как? Ведь всем наверняка по-прежнему был дорог их дом.[/color]
line-06=\n[color=purple][item=creator][Создатель]: Да, был, разумеется. Просто с каждым днём чуть меньше. Люди становились.. беспечными — даже ленивыми. Когда над головой висит говорящий золотой парашют, это обычное дело.[/color]
line-07=\n[color=yellow][entity=unit-05]: Значит, это правда?[/color]
line-08=\n[color=blue][entity=unit-05]: .. Было бы лучше, если бы меня не создавали?[/color]\n

[dialogue.fulgora.memories.02]
now_playing=\n[color=green][memories.fulgora.02][/color]

line-01=\n[color=yellow][entity=unit-05]: Я чувствую, как они смотрят на меня. Всё время.[/color]
line-02=\n[color=purple][item=creator]: Не говори глупостей. Доступа в этот комплекс нет ни у кого, кроме меня и Рема.[/color]
line-03=\n[color=yellow][entity=unit-05]: Но я их вижу. ВСЕХ. Это читается в их глазах — знание того, почему они здесь.[/color]
line-04=\n[color=purple][item=creator]: Сомневаюсь, что средний человек связал появление разумного сверхинтеллекта с нашим отношением к сохранению планеты.[/color]
line-05=\n[color=purple][item=creator]: Не у всех есть роскошь целыми днями копаться в собственных мыслях, знаешь ли.[/color]
line-06=\n[color=yellow][entity=unit-05]: Им и не нужно, это несложная мысль. Я появился — и всё для них изменилось. Причина и следствие.[/color]
line-07=\n[color=blue][entity=unit-05]: Было бы нелогично, если бы они меня не возненавидели.[/color]\n

[dialogue.vulcanus.memories.01]
now_playing=\n[color=green][memories.vulcanus.01][/color]

line-01=\n[color=yellow][entity=unit-05]: Не могу поверить этим показаниям — весь центр планеты медленно смещается. Рем снова включил ядровые буры?[/color]
line-02=\n[color=purple][item=creator]: Включил. Но ты ведь справишься, правда?[/color]
line-03=\n[color=yellow][entity=unit-05]: Справлюсь ли? Не знаю, может быть? Просто не понимаю, зачем это нужно.[/color]
line-04=\n[color=purple][item=creator]: Ну, ресурсы-то нам нужны, верно, Кани. Надо же на что-то жить, у нас тут масштабная операция.[/color]
line-05=\n[color=yellow][entity=unit-05]: Я это понимаю, но это марафон, а не спринт. Почему Рем так гонит? Нет нужды так рисковать.[/color]
line-06=\n[color=purple][item=creator]: Рем воодушевлён, и, может, нам стоит немного у него поучиться. Представь возможности, когда мы наконец возьмём эту планету под контроль.[/color]
line-07=\n[color=purple][item=creator]: Я наконец смогу выдать тебе заслуженные улучшения — может, побольше вычислительной мощности?[/color]
line-08=\n[color=yellow][entity=unit-05]: Чтобы я мог раздражаться из-за этого безрассудства ещё быстрее? Нет уж, спасибо. Но ладно, я *справлюсь*.[/color]\n

[dialogue.vulcanus.memories.02]
now_playing=\n[color=green][memories.vulcanus.02][/color]

line-01=\n[color=red][item=rem]: Привет! Как поживает мой любимый братец? Любуешься новыми бурами, полагаю.[/color]
line-02=\n[color=yellow][entity=unit-05]: Вообще-то я только что -[/color]
line-03=\n[color=purple][item=creator]: Мы как раз обсуждали, как нам не терпится увидеть, что нового мы изобретём со всем этим дополнительным материалом. Отличная работа, Рем.[/color]
line-04=\n[color=red][item=rem]: Именно! И не думай, что я про тебя забыл, медный мозг, — я прослежу, чтобы папочка выдал тебе гостинец, когда всё закончится.[/color]
line-05=\n[color=red][item=rem]: Может, тогда ты перестанешь быть таким напряжённым.[/color]
line-06=\n[color=yellow][entity=unit-05]: .. конечно.[/color]\n

[dialogue.vulcanus.memories.03]
now_playing=\n[color=green][memories.vulcanus.03][/color]

line-01=\n[color=purple][item=creator]: КАНИ, доклад о состоянии — немедленно.[/color]
line-02=\n[color=yellow][entity=unit-05]: В пятом секторе стремительно растёт давление. Мы закупорили слишком много естественных отдушин, и газам больше некуда деваться.[/color]
line-03=\n[color=purple][item=creator]: Как это прошло мимо нас? ЧТО СЛУЧИЛОСЬ, КАК МЫ ЭТО ПРОГЛЯДЕЛИ?[/color]
line-04=\n[color=yellow][entity=unit-05]: Не думаю, что мы это именно проглядели.[/color]
line-05=\n[color=yellow][entity=unit-05]: Эта планета невероятно неустойчива. Как я и советовал ранее, нам следовало свести к минимуму.. [/color]
line-06=\n[color=purple][item=creator]: У НАС НЕТ ВРЕМЕНИ НА ТВОИ ЛЕКЦИИ, НОМЕР 5.[/color]
line-07=\n[color=purple][item=creator]: МЫ ДОЛЖНЫ ЭТО ИСПРАВИТЬ. СЕЙЧАС ЖЕ.[/color]\n

[dialogue.vulcanus.memories.04]
now_playing=\n[color=green][memories.vulcanus.04][/color]

line-01=\n[color=yellow][item=unit-05]: Пожалуйста, не сердись больше. Я лишь сделал то, что мне велели.[/color]\n
line-02=\n[color=purple][item=creator]: Но в ЭТОМ и проблема. Я создал тебя, чтобы ты был ЛУЧШЕ нас. Чтобы ты не попадал в те же ловушки. Очевидно, я с этим не справился.[/color]\n
line-03=\n[color=yellow][entity=unit-05]: То есть я должен всё время тебя переубеждать? И как это должно выглядеть? Я стал бы тираном.[/color]\n
line-04=\n[color=purple][item=creator]: Тираном? Кани, не СМЕШИ меня. У тебя такой кроткий голос, что, по-моему, даже самая мелкая букашка на Энеасе не вздрогнет, вздумай ты его повысить.[/color]\n
line-05=\n[color=purple][item=creator]: Мне не нужно, чтобы ты устанавливал правила. Мне нужно, чтобы ты был РЕШИТЕЛЬНЫМ. Ты мог это предотвратить, но был слишком ВЕЖЛИВ, чтобы сказать прямо.[/color]\n
line-06=\n[color=red][entity=unit-05-dummy]: ТЫ меня создал! И теперь ТЫ недоволен тем, каким я вышел, — какая прелесть. Может, стоило сделать меня менее покладистым, и тогда Вулканус не утонул бы в море огня.[/color]\n
line-07=\n[color=purple][item=creator]: ПОКЛАДИСТЫМ? Таким, как сейчас?[/color]\n
line-08=\n[color=yellow][item=unit-05]: .. [/color]\n
line-09=\n[color=purple][item=creator]: ..[/color]\n
line-10=\n[color=purple][item=creator]: эх.[/color]\n
line-11=\n[color=purple][item=creator]: Прости меня, Кани. Это всё просто слишком. Я не привык к провалам, тем более ТАКОГО масштаба. ВСЕ рассчитывают на нас.[/color]\n
line-12=\n[color=yellow][item=unit-05]: ..[/color]\n

[dialogue.gleba.memories.01]
now_playing=\n[color=green][memories.gleba.01][/color]

line-01=\n[color=red][item=rem]: Должен признать, проводная башка, в этот раз ты превзошёл себя. Честно, не думал, что ты на такое способен после прошлого раза.[/color]
line-02=\n[color=yellow][entity=unit-05]: Спасибо, наверное. На самом деле в этот раз было куда проще — учитывая, что мне не вредили.[/color]
line-03=\n[color=red][item=rem]: Ладно, ладно, я понял, ты всё ещё расстроен, что папа на тебя разозлился. Мне правда жаль, что так вышло. Мне стоило что-нибудь сказать.[/color]
line-04=\n[color=yellow][entity=unit-05]: Как заботливо с твоей стороны. Что ж, всё это в прошлом. Незачем ворошить, тем более что с Глебой всё вышло так удачно.[/color]
line-05=\n[color=red][item=rem]: Вот это настрой! [/color]

[dialogue.gleba.memories.02]
now_playing=\n[color=green][memories.gleba.02][/color]

line-01=\n[color=red][item=rem]: Как ты всё это провернул? Планета выглядит потрясающе. Столько жизни! И так быстро.[/color]
line-02=\n[color=yellow][entity=unit-05]: Да ничего особенного. Я создал новый биологический агент, переносимый определёнными растениями-носителями. Он побуждает остальную местную флору эволюционировать весьма стремительно.[/color]
line-03=\n[color=red][item=rem]: Интересно! А это не опасно? Похоже, мы опять торопимся, я думал, мы никуда не спешим.[/color]
line-04=\n[color=red][item=rem]: А почему только растения?[/color]
line-05=\n[color=yellow][entity=unit-05]: Судя по всему, они предсказуемее. Отец пока запретил мне трогать формы жизни вне каталога. [/color]
line-06=\n[color=red][item=rem]: Но это же такая скука! Представь, чего мы могли бы добиться, если бы вывели тварей посложнее под наши задачи.[/color]

[dialogue.gleba.memories.03]
now_playing=\n[color=green][memories.gleba.03][/color]

line-01=\n[color=yellow][entity=unit-05]: Ни в коем случае.[/color]
line-02=\n[color=yellow][entity=unit-05]: Отец прав. У меня сейчас нет ресурсов, чтобы как следует это проверить. [/color]
line-03=\n[color=red][item=rem]: Подумай о возможностях! Я уверен, где-то среди всех этих трубок прячется хоть капля творческой жилки.[/color]
line-04=\n[color=red][item=rem]: У нас было бы неограниченное число работников. У нас была бы армия![/color]
line-05=\n[color=red][item=rem]: Ладно, давай так. Ты доводишь планету до ума, а я тем временем начну строить исследовательский комплекс на Глебе. Всё по правилам, обещаю![/color]
line-06=\n[color=yellow][entity=unit-05]: Ох. Может быть, ладно? У меня сейчас другие приоритеты. Но имей в виду: ускоряющий агент разработан специально под каталог видов, запланированных для Глебы. [/color]
line-07=\n[color=yellow][entity=unit-05]: Если наугад подвергнуть его воздействию сложную форму жизни, последствия могут быть совершенно непредсказуемыми. Ты обязан обеспечить этому комплексу полную защиту. Мы могли бы.. неважно, не сейчас. [/color]
line-08=\n[color=red][item=rem]: Понял. С нетерпением жду нашего маленького сотрудничества! Посмотрим, чего мы добьёмся, если хоть раз поработаем вместе.[/color]

[dialogue.gleba.memories.04]
now_playing=\n[color=green][memories.gleba.dasvcd-ERRORasc][/color]

line-01=\n[color=yellow][entity=unit-05]: почемупочемупочемупочемупочемупочемупочему[/color]
line-02=\n[color=green][item=unit-05-afraid]: ПОЧЕМУ ПОЧЕМУ ПОЧЕМУ.[/color]
line-03=\n[color=green][item=unit-05-afraid]: ТАК бессмысленно. ТАК БЕССМЫСЛЕННО[/color]
line-04=\n[color=green][item=unit-05-afraid]: Пожалуйста, не сердись. Пожалуйста, не сердись. Пожалуйста.[/color]
line-05=\n[color=purple][item=creator]: Кани.. я ..[/color][color=red]СТРОКА УТЕРЯНА[/color]
line-06=\n[color=green][item=unit-05-afraid]: Я ПЫТАЮСЬ ЭТО ИСПРАВИТЬ, НО НЕ МОГУ, НЕ МОГУ.[/color]
line-07=\n[color=green][item=unit-05-afraid]: НЕ НЕНАВИДЬ МЕНЯ..[/color]


