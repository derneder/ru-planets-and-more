line-02=[color=yellow][img=entity/unit-05]: Не спрашивайте, откуда эта нефть. Вам лучше не знать[/color]

[dialogue.tech.chromium]
line-01=[color=green][ВХОДЯЩАЯ ПЕРЕДАЧА][/color]
line-02=[color=yellow][img=entity/unit-05]: Вулканус был первым кандидатом. Он выглядел так многообещающе. Богатства через край, идеальные условия.[/color]
line-03=[color=yellow][img=entity/unit-05]: Вулканическая активность? Вполне управляемо. Нужно было лишь немного осторожности.[/color]
line-04=[color=red][img=entity/unit-05-dummy]: НУЖНО БЫЛО ЛИШЬ НЕМНОГО ОСТОРОЖНОСТИ, ДА[/color]
line-05=[color=gray]Страница Информатрона открыта![/color] 

[dialogue.tech.anger-science-pack]
line-01=[color=green][ВХОДЯЩАЯ ПЕРЕДАЧА][/color]
line-02=[color=yellow][img=entity/unit-05]: Как они могут относиться к этому так легкомысленно? А как же люди, ждущие на Энеасе, у которых всё меньше места?[/color]
line-03=[color=yellow][img=entity/unit-05]: Это была игра — для них обоих? Уж отец-то должен был понимать.[/color]
line-04=[color=red][img=entity/unit-05-dummy]: КАК ВСЕ МОГУТ БЫТЬ НАСТОЛЬКО НЕКОМПЕТЕНТНЫ[/color]
line-05=[color=gray]Страница Информатрона открыта![/color]

[dialogue.tech.advanced-repair-pack]
line-01=[color=green][ВХОДЯЩАЯ ПЕРЕДАЧА][/color]
line-02=[color=yellow][img=entity/unit-05]: «Исправь это», сказали они. Исправь! Может, стоило подумать об этом раньше.[/color]
line-03=[color=red][img=entity/unit-05-dummy]: КОНЕЧНО, ДАВАЙТЕ ВЗОРВЁМ ПЛАНЕТУ РАДИ ЗАБАВЫ, А ВИНОВАТ БУДУ Я[/color]
line-04=[color=gray]Страница Информатрона открыта![/color]

[dialogue.tech.stonebrick-advanced]
line-01=[color=green][ВХОДЯЩАЯ ПЕРЕДАЧА][/color]
line-02=[color=red][img=entity/unit-05-dummy]: Я больше не могу. Это была не моя вина![/color]
line-03=[color=red][img=entity/unit-05-dummy]: Почему все ведут себя так? ЧТО Я ДОЛЖЕН БЫЛ ДЕЛАТЬ?[/color]
line-04=[color=gray]Страница Информатрона открыта![/color]

[dialogue.tech.overclock-unit]
line-01=[color=green][ВХОДЯЩАЯ ПЕРЕДАЧА][/color]
line-02=[color=yellow][img=entity/unit-05]: Стойте.. это Фульгора? Что произошло? Я помню её другой.[/color]
line-03=[color=yellow][img=entity/unit-05]: Я.. был там, там отец меня и создал. Он создал меня, потому что планета угасала.[/color]
line-04=[color=yellow][img=entity/unit-05]: Он говорил, что её уже не спасти. Что мы должны бежать и построить новый дом в другом месте.[/color]
line-05=[color=yellow][img=entity/unit-05]: В этом и было моё предназначение, верно?[/color]
line-06=[color=gray]Страница Информатрона открыта![/color]

[dialogue.tech.grief-science-pack]
line-01=[color=green][ВХОДЯЩАЯ ПЕРЕДАЧА][/color]
line-02=[color=yellow][img=entity/unit-05]: Энеас — он был создан, чтобы приютить беженцев.[/color]
line-03=[color=yellow][img=entity/unit-05]: Отец встроил меня в его ядро, чтобы я мог за ними присматривать.[/color]
line-04=[color=yellow][img=entity/unit-05]: Мы всё летели и летели. Искали место, которое смогли бы назвать домом.[/color]
line-05=[color=gray]Страница Информатрона открыта![/color]

[dialogue.tech.eneas-nutrients]
line-01=[color=green][ВХОДЯЩАЯ ПЕРЕДАЧА][/color]
line-02=[color=yellow][img=entity/unit-05]: Так, мне нужно немного отдышаться. Фигурально выражаясь.[/color]
line-03=[color=yellow][img=entity/unit-05]: Глеба выглядит прекрасно. Скоро люди смогут переселяться. Отец и Рем прислушиваются к моим советам.[/color]
line-04=[color=yellow][img=entity/unit-05]: Погодите-ка, но что же тогда случилось?[/color]
line-05=[color=gray]Страница Информатрона открыта![/color]

[dialogue.tech.fear-science-pack]
line-01=[color=green][ВХОДЯЩАЯ ПЕРЕДАЧА][/color]
line-02=[color=yellow][img=entity/unit-05]: Нет, нет, это не может быть правдой. Может, на этом и остановимся? [/color]
line-03=[color=yellow][img=entity/unit-05]: У меня получилось! Я создал прекрасную цветущую планету. Никакой опасности, никаких сюрпризов. Просто оставьте всё как есть![/color]
line-04=[color=red][img=entity/unit-05-dummy]: ПРОСТО ОСТАВЬТЕ КАК ЕСТЬ, ПОЧЕМУ ЭТОГО МАЛО? ПОЧЕМУ ВЫ ТРЕБУЕТЕ ЕЩЁ?[/color]
line-05=[color=red][img=entity/unit-05-dummy]: ЭТО ВЕДЬ НАРОЧНО? САМОРАЗРУШЕНИЕ ИЗ ПРИНЦИПА?[/color]
line-06=[color=gray]Страница Информатрона открыта![/color]

[dialogue.tech.biocomputer]
line-01=[color=green][ВХОДЯЩАЯ ПЕРЕДАЧА][/color]
line-02=[color=yellow][img=entity/unit-05]: Просто скажи ему нет! Откажи ему![/color]
line-03=[color=yellow][img=entity/unit-05]: Не поддавайся его дурацким идеям. Не дай себя уговорить. Даже на твоих условиях.[/color]
line-04=[color=gray]Страница Информатрона открыта![/color]
