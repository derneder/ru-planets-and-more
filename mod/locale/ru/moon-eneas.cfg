[mod-description]
moon-eneas=Над облаками Наувиса покоится древняя луна Энеас. Она хранит не только тайны истории этой звёздной системы, но и загадочную машину по имени юнит-05.\n\n Энеас не изменяет ванильное содержимое, а лишь добавляет новые предметы и рецепты. Мод также улучшает прохождение ранней игры и содержит базу знаний для любителей лора Factorio.

