[entity-description]
debris-a=Крупные чужеродные обломки, прилетевшие с одной из лун Наувиса. Содержат следы древних технологий. При добыче вручную есть шанс получить ещё более ценные предметы.
debris-b=Средние чужеродные обломки, прилетевшие с одной из лун Наувиса. Содержат следы древних технологий. При добыче вручную есть шанс получить ещё более ценные предметы.
debris-c=Мелкие чужеродные обломки, прилетевшие с одной из лун Наувиса. Содержат следы древних технологий. При добыче вручную есть шанс получить ещё более ценные предметы.

eneas-vent=Под поверхностью [planet=eneas] Энеаса скопились почти бесконечные объёмы грязи и загрязнения. Время от времени это жерло выбрасывает ядовитые газы, отвлекающие юнита-05.\n\n Перекрыть или разрушить жерло не поможет — газы всё равно найдут путь на поверхность.
auto-deconstruct-radar=Продвинутый радар с гораздо большим радиусом постоянного обзора. При подключении к цепи автоматически отдаёт приказ на снос сущностей в зависимости от сигнала.\n\nТакже можно приказать ему сносить предметы, лежащие на земле, с помощью сигнала [virtual-signal=signal-mining].

eneas-lift=Доставляет ресурсы из подземных производственных цехов Энеаса на поверхность. Количество за цикл зависит от уровня загрязнения на Энеасе.\n\nВыработку можно повысить, исследуя технологии, связанные с [entity=eneas-lift] подъёмником.
eneas-generator=Машины, основанные на древних технологиях, питают себя сами, поэтому крупные электростанции им не нужны.\n\n[entity=unit-05] Юнит-05 подготовил этот примитивный энергетический интерфейс в ожидании вашего прибытия.
unit-05=Главный узел [entity=unit-05] юнита-05. Потребляет [item=ambition-science-pack] пакеты воспоминаний, чтобы восстановить утраченные фрагменты памяти.\nТребует питания от источника [item=significant-data-card] данных.

