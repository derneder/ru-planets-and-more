[technology-description]
artifact-analysis-basic=Хотя их истинное назначение остаётся неизвестным, [item=eneas-artifact] артефакты, разбросанные по Наувису, можно разобрать на полезные припасы.
artifact-analysis-expert=В разработке — на этом заканчивается первая часть Энеаса. Аквило и финал игры будут раскрыты во второй части.

basic-data-management=Научитесь создавать простые инструменты на основе данных, способные улучшить другие части фабрики.
planet-discovery-eneas=Маленькая и неприметная луна с климатом, схожим с наувисским. Дальнейшее изучение показывает, что именно она — источник получаемых нами сигналов.
artifact-drilling=Артефакты можно добывать напрямую из недр Энеаса.

ambition-science-pack=Воспоминания об амбициях
fear-science-pack=Воспоминания о страхе
anger-science-pack=Воспоминания о гневе
grief-science-pack=Воспоминания о скорби

lesser-ai=Крайне примитивный искусственный интеллект, способный помочь [entity=unit-05] юниту-05 в обработке [item=ambition-science-pack] пакетов воспоминаний.

advanced-radar=Продвинутый радар с гораздо большим радиусом постоянного обзора. При подключении к цепи автоматически отдаёт приказ на снос сущностей в зависимости от сигнала.
module-tech=Используя детали артефактов, модули можно довести до более высокого уровня раньше обычного.
module-tech-2=Используя древние ядра, продвинутые модули можно довести до более высокого уровня раньше обычного.

engineer-assembler=Продвинутый сборочный автомат, вдохновлённый инженерными технологиями. Обладает врождённым бонусом к производительности. Не требует электричества, но нуждается в постоянном потоке данных.

lurker-tech=Кажется, в мутных водах Энеаса что-то прячется...

supply-tech=Позволяет [entity=unit-05] юниту-05 производить больше ресурсов за цикл на Энеасе.
codex-tech=Позволяет [entity=unit-05] юниту-05 производить [item=notable-codex] значимые кодексы, тем больше, чем ниже загрязнение. Предметы будут доставляться каждый цикл к [entity=eneas-lift] подъёмнику ресурсов.\n\nЭти данные — более эффективный источник топлива по сравнению с [item=significant-data-card] картами значимых данных.
oil-tech=Позволяет [entity=unit-05] юниту-05 производить [item=heavy-oil-barrel] бочки с нефтью, тем больше, чем ниже загрязнение. Предметы будут доставляться каждый цикл к [entity=eneas-lift] подъёмнику ресурсов.

