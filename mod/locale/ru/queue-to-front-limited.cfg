[mod-name]
QueueToFrontLimited=Очередь в начало (с лимитом)

[mod-description]
QueueToFrontLimited=Основан на оригинальном моде QueueToFront. ALT+Q переключает режим постановки в очередь между «в конец» (по умолчанию) и «в начало». Эта версия добавляет настройку карты, позволяющую администраторам блокировать добавление новых рецептов, если лимит очереди превышен. Также есть команда /crafting_queue_list для просмотра режима и количества у всех подключённых игроков — помогает понять, кто может вызывать лаги на сервере.

[controls]
queue-to-front=Переключить порядок очереди

[qtf-message]
queue-to-front=Режим очереди: В НАЧАЛО
queue-to-back=Режим очереди: В КОНЕЦ (по умолчанию)
queue-too-large=ОШИБКА: очередь слишком большая для постановки в начало

[mod-setting-name]
qtfl_queue_limit=Лимит очереди

[mod-setting-description]
qtfl_queue_limit=Сколько рецептов должно быть в очереди, прежде чем добавление в начало очереди будет заблокировано
