[technology-description]
ei_em-trains=ЭМ-поезда — новый тип поездов, использующий для движения полевую тягу. Это делает поезда быстрее и эффективнее. Размещайте зарядники в радиусе действия, чтобы поезда продолжали ходить.

[item-description]
ei_charger=Заряжает ЭМ-поезда в радиусе действия. Каждая зарядка расходует энергию. Улучшается исследованиями. Потребляет 10 МВт в простое. Требует 250 Вт на каждый рельс в радиусе.
ei_em-locomotive=ЭМ-локомотив. Быстрее и эффективнее обычных локомотивов. Для работы требует действующий зарядник в радиусе действия.
ei_em-cargo-wagon=ЭМ-грузовой вагон. Имеет 60 слотов для предметов.
ei_em-fluid-wagon=ЭМ-цистерна. Перевозит 50 тыс. единиц жидкости.

