planet-muluna=Исследуйте Мулуну — луну Наувиса, источник космического исследовательского пакета, и сделайте первый шаг в космос. Собирайте данные с небес и доставляйте их на Мулуну, чтобы получать Исследовательскую науку и улучшать свои космические платформы, продвигаясь всё глубже в космос.
