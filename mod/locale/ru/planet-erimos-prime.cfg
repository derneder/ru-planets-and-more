info_mod_rules=[img=virtual-signal/signal-info]*Правила мода*[img=virtual-signal/signal-info]\nНа каждом уровне есть терминал, который нужно починить. После ремонта и подачи энергии он покажет задачи текущего уровня.\nЗадачи можно выполнять в любом порядке. Когда выполнены все, на терминале появится кнопка перехода всей команды на следующий уровень.\nПочиненный терминал вместе с подключёнными конвейерами, трубами и опорами ЛЭП позволяет передать предметы, жидкости и энергию на следующий уровень. Убедитесь, что всё собрано и подключено, прежде чем нажимать кнопку завершения уровня.\nОставленная позади фабрика сохранится как есть, и её больше не будут атаковать.\nВернуться на предыдущий уровень нельзя — только через сброс планеты.\nКнопка сброса/выхода появится у любого игрока, погибшего 4 раза за короткое время.
has_left_planet=__1__ бросил бой и сбежал с [planet=erimos-prime]!
level_restart=Команда принята: __1__ подтвердил запрос на сброс миссии на [planet=erimos-prime]! Операция перезапускается с текущего уровня.
full_restart=Сводка центра управления: __1__ запустил полную перезагрузку миссии на [planet=erimos-prime]. Готовьтесь к повторной высадке.
