mission_1_text=Восстановите разрушенные постройки
mission_1_tooltip=Вы высаживаетесь среди человеческих трупов и странных паукообразных тварей. Жуткая картина смерти и разрушения. Лучше начать с ремонта этих зданий и укрепления обороны...
mission_2_text=Восстановите резервуары и накопите пар
mission_2_tooltip=Снова смерть и разрушение. Похоже, здешние инженеры вырабатывали пар для энергии или чего-то похожего. Отремонтируем все эти резервуары и наполним их паром.
mission_3_text=Изучите тела паукообразных в лаборатории патогенов
mission_3_tooltip=Похоже, эта странная лаборатория патогенов была построена для изучения паукообразных тварей, но исследование так и не довели до конца. Мы обязаны его завершить и выяснить, откуда идут атаки.
mission_4_text=Почините ядровый экстрактор и устраните угрозу
mission_4_tooltip=Инженеры выяснили, что этих тварей притягивает вибрация машин. И что же они сделали? Построили огромный бур, чтобы выманить их и убить вожака. Всё пошло не по плану... миссия провалилась. Но у нас получится. На этот раз мы закончим начатое. Пошумим!
mission_5_text=Найдите другие планеты и выбирайтесь из этого ада
mission_5_tooltip=Следующий шаг — добраться до древней роботизированной фабрики. Нужно её починить, собрать дроидов и отправить их искать другие планеты. Только тогда мы сможем построить ракету и покинуть этот мир!

