[mod-name]
far-reach=Дальний охват

[mod-description]
far-reach=Стройте, взаимодействуйте и добывайте в пределах всего экрана. Дистанции настраиваются. Замена немодерируемым модам вроде Long Reach.

[mod-setting-name]
far-reach-build-distance-bonus=Бонус дистанции строительства
far-reach-reach-distance-bonus=Бонус дистанции взаимодействия
far-reach-resource-reach-distance-bonus=Бонус дистанции добычи
far-reach-item-drop-distance-bonus=Бонус дистанции выброса предметов
far-reach-item-pickup-distance-bonus=Бонус дистанции подбора предметов

[mod-setting-description]
far-reach-build-distance-bonus=Дополнительная дистанция для строительства. Может быть до 100000. Также работает в виде карты. Установите 0 для ванильного опыта.
far-reach-reach-distance-bonus=Дополнительная дистанция для взаимодействия. Может быть до 100000. Установите 0 для ванильного опыта.
far-reach-resource-reach-distance-bonus=Дополнительная дистанция для добычи. Может быть до 100000. Установите 0 для ванильного опыта.
far-reach-item-drop-distance-bonus=Дополнительная дистанция для выброса предметов. Может быть до 1000. Установите 0 для ванильного опыта.
far-reach-item-pickup-distance-bonus=Дополнительная дистанция для подбора предметов с земли и конвейеров. Может быть до 100. Установите 0 для ванильного опыта.
