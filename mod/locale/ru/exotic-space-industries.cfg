ei-advanced-logistic-bot=Высокотехнологичный логистический бот. Быстрый, с большим радиусом действия и повышенной вместимостью.
ei-advanced-construction-bot=Высокотехнологичный строительный бот. Быстрый, с большим радиусом действия и повышенной вместимостью.
ei-excavator=Потребляет [color=blue]воду[/color][fluid=water] и производит [color=orange]15/с камня[/color][item=stone] и [color=brown]грязную воду[/color][fluid=ei-dirty-water].
ei-metalworks-1=Быстро и эффективно обрабатывает [color=orange]слитки[/color].
ei-metalworks-2=Быстро и эффективно обрабатывает [color=orange]слитки[/color].
