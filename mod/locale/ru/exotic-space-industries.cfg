ei-advanced-construction-bot=Высокотехнологичный строительный бот. Быстрый, с большим радиусом действия и повышенной вместимостью.
nuclear-reactor=Использует урановые топливные элементы для выработки тепла. Тепловая мощность НЕ увеличивается при постройке рядом с другими реакторами.
ei-crystal-accumulator=Кристалл излучает энергию. Судя по всему, при длительной работе он нестабилен: при демонтаже вы получите сломанное устройство.
ei-crystal-accumulator-gaia=Кристалл излучает энергию. Судя по всему, при длительной работе он стабилен.

[technology-description]
ei-dark-age=Первая эпоха мода Exotic Industries. Знакомство с автоматизацией на топливе.
ei-steam-age=Вторая эпоха мода Exotic Industries. Используйте паровые машины, чтобы автоматизировать базу и двигаться дальше.
ei-electricity-age=Третья эпоха мода Exotic Industries. Обуздайте электричество и перейдите к более сложной химии.
ei-computer-age=Четвёртая эпоха мода Exotic Industries. Компьютерные системы позволят ещё больше повысить эффективность фабрики и автоматизировать сложные задачи.
ei-quantum-age=Пятая эпоха мода Exotic Industries. Вас ждут термоядерный синтез и высокотехнологичные машины!
ei-exotic-age=Шестая и последняя эпоха мода Exotic Industries. Победите в игре, завершив постройку суперструктуры.
ei-steam-assember=Базовая автоматизация на пару.
ei-steam-oil-processing=Освойте базовую переработку нефти и используйте её для простой химии или производства топлива.
ei-electricity-power=Освойте базовое производство электричества и запитайте им свои машины.
ei-destill-tower=Разделяйте нефть на составляющие.
ei-computer-core=Освойте базовую автоматизацию на компьютерах.
ei-big-lab=Для исследования более сложных технологий нужны продвинутые лаборатории.
ei-induction-matrix=Индукционная матрица — огромное составное хранилище энергии. Подробности — в энциклопедии Информатрон.
ei-neodym-refining=Обогащайте неодимовую руду до слитков. Они необходимы для высокотехнологичных машин.
ei-deep-mining=Освойте глубинную добычу: больше ресурсов, а также ресурсы, встречающиеся только в глубоких слоях Наувиса.
ei-moon-exploration=Добудьте лунную рыбу и приступите к освоению космоса.
ei-quantum-computer=Освойте автоматизацию на квантовых компьютерах.
ei-fluid-boiler=Потребляет [color=orange]горючие жидкости[/color] для производства пара. К [color=orange]горючим жидкостям[/color] относятся нефть, нефтепродукты и вообще любые жидкости с топливной ценностью.
ei-small-inserter=Манипулятор размером 2x2 со слотами фильтра. Способен перемещать целые стопки предметов за раз.
ei-big-inserter=Манипулятор размером 2x2 со слотами фильтра. Способен перемещать целые стопки предметов за раз и на высокой скорости.
