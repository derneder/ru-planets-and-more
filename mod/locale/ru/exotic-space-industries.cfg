[mod-setting-description]
ei-debloat=При включении убирает исследовательские пакеты ранней игры (от тёмной до компьютерной эпохи) из большинства технологий, идущих после двигателей.
ei-em_updater_que=Отображать визуальный индикатор между ЭМ-поездами и зарядниками (или поверх них) в момент передачи энергии
ei-em_updater_que_width=Задаёт радиус отображаемых колец
ei-em_updater_que_transparency=Задаёт прозрачность отображаемых колец. Диапазон 1—100 (непрозрачно)
ei-em_updater_que_timetolive=Задаёт время до исчезновения кольца
ei-em_train_glow=Включает эффект свечения при передаче энергии ЭМ-поезду
ei-em_train_glow_timetolive=Тиков до затухания свечения поезда. Эффекты складываются. Уменьшение значения повышает производительность. 60 тиков — это 1 секунда.
ei-em_charger_glow=Включает эффект свечения при передаче энергии зарядником
ei-em_charger_glow_timetolive=Тиков до затухания свечения зарядника. Эффекты складываются. Уменьшение значения повышает производительность. 60 тиков — это 1 секунда.
ei-max_updates_per_tick=Количество обновлений на каждый тип сущностей, выполняемых за тик
ei_ticks_per_full_update=Задаёт число тиков, за которое обновляются все сущности EI
ei-loader-prototype-complexity=Включает или отключает сложные рецепты погрузчиков. При включении скоростной погрузчик получает фильтрацию, а нео-погрузчик — работу со стопками
ei-rocket-lift-capacity-buff=Умножает грузоподъёмность ракеты и посадочной площадки. РЕКОМЕНДУЕТСЯ ЗАПУСК РАКЕТ ПО СИГНАЛУ ЦЕПИ
ei-beacon-overload=Задуманное поведение. Ограничивает количество маяков, влияющих на одно здание, как в Space Exploration
ei-ash=При сжигании химического топлива образуется зола: её можно переработать, но куда-то девать её всё равно придётся
ei-slag=Плавильни, кроме плазменного нагревателя, дают шлак: его можно переработать, но куда-то девать его всё равно придётся

