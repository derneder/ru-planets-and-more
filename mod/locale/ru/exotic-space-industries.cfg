ei-fluid-heater=Производит тепло, сжигая:
ei-fluid-boiler=Производит пар, сжигая:
ei-tank-1=Соотношение объём:железо 600:1. 1000 ед. прочности, 30% сопротивления физическому урону, 60% [color=red]огню[/color], 60% ударам.
ei-tank-2=Соотношение объём:железо 666:1. 1500 ед. прочности, 40% сопротивления физическому урону, 70% [color=red]огню[/color], 70% ударам.
ei-tank-3=Соотношение объём:железо 750:1. 200 ед. прочности, 60% сопротивления физическому урону, 80% [color=red]огню[/color], 78% ударам.
ei-insulated-pipe=Изолированная труба — особый вид труб для транспортировки [color=red]очень горячих (плазмы, газов)[/color] или [color=blue]холодных жидкостей (сжиженных газов)[/color], которые иначе повредили бы трубу.
ei-insulated-underground-pipe=Изолированная труба — особый вид труб для транспортировки [color=red]очень горячих (плазмы, газов)[/color] или [color=blue]холодных жидкостей (сжиженных газов)[/color], которые иначе повредили бы трубу.
ei-insulated-tank=Изолированный резервуар — особый вид резервуаров для хранения [color=red]очень горячих (плазмы, газов)[/color] или [color=blue]холодных жидкостей (сжиженных газов)[/color], которые иначе повредили бы резервуар.
ei-cooler=Гиперохладитель для перевода газов в жидкую фазу. Для транспортировки сжиженных газов используйте [color=blue]изолированные трубы[/color] [item=ei-insulated-pipe].
ei-data-pipe=Специальный кабель данных, способный передавать [color=blue]вычислительную мощность[/color] [fluid=ei-computing-power].
ei-stone-quarry=Этот карьерный бур добывает [color=orange]камень[/color] [item=stone] где угодно.
ei-electric-stone-quarry=Этот карьерный бур добывает [color=orange]камень[/color] [item=stone] где угодно.
ei-deep-drill=Эта буровая добирается до рудных жил. Для работы требуется [color=orange]1/с бурового раствора[/color] [fluid=ei-drill-fluid].
ei-advanced-drill=Эта буровая добирается до рудных жил. Для работы требуется [color=orange]2/с бурового раствора[/color] [fluid=ei-drill-fluid].
ei-deep-pumpjack=Улучшенная нефтекачалка. Может добывать также [color=blue]криофлюкс[/color][fluid=ei-cryoflux] и [color=green]фитогаз[/color][fluid=ei-phythogas].
ei-exotic-assembler=Этот сборочный автомат позволяет создавать [color=orange]экзотические предметы[/color]. Однако экзотическая материя крайне нестабильна, поэтому автомат нужно ставить рядом с [color=blue]стабилизатором материи[/color], иначе он взорвётся.
ei-computer-core=Требует электричества и электронных компонентов, чтобы производить [color=blue]вычислительную мощность[/color] [fluid=ei-computing-power]. Чтобы использовать её, подключите [color=orange]кабель данных[/color] [item=ei-data-pipe].
ei-quantum-computer=Крайне продвинутый компьютер. Подавайте различные материалы, чтобы получать высокотехнологичные данные.
ei-matter-stabilizer=Рукотворный стабилизатор материи. Стабилизирует [color=orange]сборочные автоматы экзотической материи[/color] [item=ei-exotic-assembler] и не даёт им взорваться.
ei-copper-beacon=Маяк с жидкостным охлаждением. Для работы требуется [color=blue]1/с жидкого азота[/color] [fluid=ei-liquid-nitrogen]. Считается за [color=orange]1[/color] маяк при подсчёте перегрузки.
ei-iron-beacon=Маяк с жидкостным охлаждением. Для работы требуется [color=blue]2/с жидкого азота[/color] [fluid=ei-liquid-nitrogen]. Считается за [color=orange]2[/color] маяка при подсчёте перегрузки.
ei-induction-matrix-core=Ядро составной конструкции индукционной матрицы. На одну матрицу можно поставить только одно ядро.
ei-induction-matrix-basic-coil=Базовая катушка составной конструкции индукционной матрицы. Увеличивает ёмкость матрицы на [color=yellow]25 МДж[/color].
ei-induction-matrix-advanced-coil=Продвинутая катушка составной конструкции индукционной матрицы. Увеличивает ёмкость матрицы на [color=yellow]100 МДж[/color].
ei-induction-matrix-superior-coil=Превосходная катушка составной конструкции индукционной матрицы. Увеличивает ёмкость матрицы на [color=yellow]1000 МДж[/color].
ei-induction-matrix-basic-converter=Базовый преобразователь составной конструкции индукционной матрицы. Увеличивает скорость передачи энергии.
ei-induction-matrix-advanced-converter=Продвинутый преобразователь составной конструкции индукционной матрицы. Увеличивает скорость передачи энергии. Считается за [color=orange]2[/color] базовых преобразователя.
ei-induction-matrix-superior-converter=Превосходный преобразователь составной конструкции индукционной матрицы. Увеличивает скорость передачи энергии. Поддерживается не более 4 штук. Считается за [color=orange]4[/color] базовых преобразователя.
ei-induction-matrix-basic-solenoid=Соленоид составной конструкции индукционной матрицы. Повышает эффективность катушек, если поставлен рядом с ними последовательно. Однако слишком много соленоидов снижает ёмкость матрицы.
ei-fission-facility=Получайте данные о делении ядра для разработки реакторов деления.
ei-high-temperature-reactor=Требует питания [color=red]теплом[/color] от других реакторов. Производит большие объёмы пара и может использовать топливо на основе [color=orange]тория[/color] [item=ei-thorium-232]. При работе на [color=green]топливном стержне с ураном-235[/color] [item=ei-uranium-235-fuel] эта машина вырабатывает 500 МВт.
ei-castor=Храните здесь свои грязные [color=yellow]ядерные отходы[/color] [item=ei-nuclear-waste].
ei-neutron-collector=Поглощает нейтроны от их источников — ядерных и термоядерных реакторов и прочих, — чтобы заряжать [color=blue]нейтронные контейнеры[/color] [item=ei-charged-neutron-container]. Эффективность зависит от расстояния до источника нейтронов: чем ближе, тем эффективнее. Чем ниже эффективность, тем дольше идёт зарядка одного [color=blue]нейтронного контейнера[/color] [item=ei-neutron-container] -> [item=ei-charged-neutron-container].
ei-neutron-activator=Насыщайте различные элементы нейтронами из [color=blue]нейтронных контейнеров[/color] [item=ei-charged-neutron-container], чтобы получать ценное термоядерное топливо.
ei-fusion-reactor=Термоядерный реактор. Способен сплавлять различные виды термоядерного топлива, нагревая [color=orange]жидкосвинцовый теплоноситель[/color] [fluid=ei-cold-coolant][fluid=ei-hot-coolant] для выработки энергии. Реактор работает в нескольких режимах. Подробности смотрите в энциклопедии Информатрон.
ei-gauss-module=[font=default-bold]Божественный модуль.[/font] Его можно использовать в [font=default-bold]любой машине, принимающей модули производительности[/font], без ограничений по рецептам.
ei-small-inserter=Манипулятор размером 2x2 со слотами фильтра. Способен перемещать целые стопки предметов за раз.
ei-big-inserter=Манипулятор размером 2x2 со слотами фильтра. Способен перемещать целые стопки предметов за раз и на высокой скорости.
ei-small-inserter-normal=Манипулятор размером 2x2. Способен перемещать целые стопки предметов за раз.
ei-big-inserter-normal=Манипулятор размером 2x2. Способен перемещать целые стопки предметов за раз и на высокой скорости.
ei-module-base=Основа модуля. Используется для изготовления различных модулей.
ei-photon-cavity=Резонатор, предназначенный для хранения фотонов.
ei-z-boson-cavity=Резонатор, предназначенный для хранения Z-бозонов.
ei-gluon-cavity=Резонатор, предназначенный для хранения глюонов.
ei-destill-tower=Ректификационная колонна, работающая на [color=red]тепле[/color]. Разделяет [color=orange]остаточную нефть[/color] [fluid=ei-residual-oil] на составляющие.
ei-advanced-destill-tower=Ректификационная колонна, работающая на [color=yellow]электричестве[/color]. Разделяет [color=orange]остаточную нефть[/color] [fluid=ei-residual-oil] на составляющие.
ei-mining-satellite=Спутник, добывающий [color=orange]породу планет[/color] [item=ei-moon-rock][item=ei-sulf-rock][item=ei-mars-rock][item=ei-uran-rock][item=ei-exotic-rock] в соответствующих точках космоса. За один запуск всегда добывает [color=red]10 000[/color] пород.
ei-exploration-satellite=Спутник, исследующий неизведанное! Отправьте его в дальний космос — возможно, он найдёт что-то интересное.
ei-rocket-silo=Запускайте ракеты в космос к разным точкам назначения. Подробности — в энциклопедии Информатрон и в окне ракетной шахты.
ei-thorium-232-fuel=Ядерное топливо на основе тория-232, работает только в [color=green]высокотемпературном реакторе[/color] [item=ei-high-temperature-reactor]. Один стержень даёт [color=orange]300 тыс. пара[/color] [fluid=steam] за 120 секунд при использовании в [color=green]высокотемпературном реакторе[/color] [item=ei-high-temperature-reactor].
ei-plutonium-239-fuel=Ядерное топливо на основе плутония-239. Один стержень даёт [color=orange]700 тыс. пара[/color] [fluid=steam] за 120 секунд при использовании в [color=green]высокотемпературном реакторе[/color] [item=ei-high-temperature-reactor].
ei-uranium-235-fuel=Ядерное топливо на основе урана-235. Один стержень даёт [color=orange]600 тыс. пара[/color] [fluid=steam] за 120 секунд при использовании в [color=green]высокотемпературном реакторе[/color] [item=ei-high-temperature-reactor].
ei-uranium-233-fuel=Ядерное топливо на основе урана-233. Один стержень даёт [color=orange]400 тыс. пара[/color] [fluid=steam] за 120 секунд при использовании в [color=green]высокотемпературном реакторе[/color] [item=ei-high-temperature-reactor].
ei-burner-inserter=Этот манипулятор сжигает топливо, чтобы перемещать предметы. Может забирать [color=orange]горючее топливо[/color] из машин, из которых он извлекает предметы.
ei-oil-refinery=Нефтеперерабатывающий завод, работающий на [color=red]тепле[/color].
ei-heat-chemical-plant=Химический завод, работающий на [color=red]тепле[/color].
ei-scanner=Сканер для анализа инопланетных артефактов. Выбор инопланетной формы жизни или артефакта запускает сканирование, дающее [color=#d43e8e]инопланетные единицы KU[/color].\n\n[color=red][ОСТОРОЖНО][/color] Сканирование уничтожает выбранную форму жизни или артефакт.
ei-space-data=Получают, запустив [color=blue]спутник[/color] [item=satellite] на [color=green]орбиту Наувиса[/color].
ei-moon-rock=Получают, запустив [color=blue]добывающий спутник[/color] [item=ei-mining-satellite] к [color=green]луне[/color].
ei-mars-rock=Получают, запустив [color=blue]добывающий спутник[/color] [item=ei-mining-satellite] к [color=green]Марсу[/color].
ei-sulf-rock=Получают, запустив [color=blue]добывающий спутник[/color] [item=ei-mining-satellite] к [color=green]серной планете[/color].
ei-uran-rock=Получают, запустив [color=blue]добывающий спутник[/color] [item=ei-mining-satellite] к [color=green]планете Уран[/color].
ei-exotic-rock=Получают, запустив [color=blue]добывающий спутник[/color] [item=ei-mining-satellite] к [color=green]астероиду[/color].
ei-black-hole-data=Получают, запустив [color=blue]наблюдательный спутник[/color] [item=ei-watch-satellite] на [color=green]орбиту чёрной дыры[/color].
ei-holo-asteroid=Декоративная голограмма.
ei-holo-gas-giant=Декоративная голограмма.
ei-holo-moon=Декоративная голограмма.
ei-holo-mars=Декоративная голограмма.
ei-holo-sun=Декоративная голограмма.
ei-holo-nauvis-orbit=Декоративная голограмма.
ei-holo-uran=Декоративная голограмма.
ei-holo-sulf=Декоративная голограмма.
biolab=Для работы требуются [item=nutrients]питательные вещества.
ei-burner-heater=Потребляет [color=orange]горючие предметы[/color] для выработки [color=red]тепла[/color].
ei-combustion-turbine=Высокоэффективная и компактная турбина с повышенным КПД.
ei-arc-furnace=Энергоёмкая печь, выдающая жидкий металл. Требует [color=red]30 МВт[/color].
ei-purifier=Обрабатывает и очищает куски руды, извлекает примеси и повышает чистоту растворов, а также может выпускать излишки воды в атмосферу
ei-crusher=Дробит руду для повышения выхода, дробит слитки для переработки, может давать [item=ei-exotic-ore][color=purple]экзотическую руду[/color] из прометиевых обломков.
ei-basic-heat-pipe=Теплопровод малой ёмкости. Передаёт тепло медленно и в небольших количествах. Выдерживает до [color=red]275 град.[/color]
ei-advanced-deep-drill=Эта буровая добирается до рудных жил. Для работы требуется [color=orange]2/с бурового раствора[/color] [fluid=ei-drill-fluid].
ei-burner-assembler=Простейший сборочный автомат, работающий на [color=orange]горючем топливе[/color]. Учтите, что [color=brown]топливные манипуляторы[/color][item=burner-inserter] могут забирать топливо прямо из него.
ei-steam-assembler=Сборочный автомат на пару. Пропускает через себя [color=orange]пар[/color][fluid=steam], необходимый для работы. Учтите, что рецептам, где пар нужен как ингредиент, потребуется отдельная паровая труба.
ei-steam-crusher=Дробилка на пару. Пропускает через себя [color=orange]пар[/color][fluid=steam], необходимый для работы.
ei-waver-factory=Изготавливайте на этой машине качественные [color=orange]полупроводники[/color][item=ei-semiconductor][item=ei-advanced-semiconductor].
ei-caster=Отливайте здесь любимые слитки[item=iron-plate][item=copper-plate][item=steel-plate][item=ei-gold-ingot][item=ei-lead-ingot][item=ei-neodym-ingot][item=ei-glass].
ei-lufter=Извлекает газы из атмосферы и выпускает их обратно.
ei-grower=Выращивайте и собирайте [color=green]энергетические кристаллы[/color][item=ei-energy-crystal][item=ei-high-energy-crystal][item=ei-enriched-cryodust]. Заодно пригоден для жизни рыбы!
ei-plasma-heater=Нагревает газы и превращает их в плазму. Потребляет много энергии, также умеет плавить.
ei-nano-factory=Крайне продвинутое производство и обработка материалов.
ei-bio-chamber=Биологическая камера для выращивания инопланетных растений.
ei-bio-reactor=Биореактор, работающий с инопланетными материалами.
ei-alien-console=Механизм, работающий с древними инопланетными данными. После постройки открывает доступ к странице инопланетных данных в энциклопедии Информатрон.
ei-gate=Межпространственные врата, построенные на основе древних инопланетных данных. Ведут в место, лежащее между измерениями. \n[color=red][ВНИМАНИЕ][/color]Не переносит живые объекты, только предметы.
ei-gate-container=Межпространственные врата, построенные на основе древних инопланетных знаний. Ведут в место, лежащее между измерениями. \n[color=red][ВНИМАНИЕ][/color]Не переносит живые объекты, только предметы.
ei-drone-port=Управляйте из этого порта одним [color=blue]дроном[/color][entity=ei-drone]. У дрона собственный инвентарь, он может ставить здания, но не имеет вооружения.
ei-crystal-accumulator-repair=Набор для ремонта сломанных кристаллических аккумуляторов. Проведите им по аккумулятору, как обычным инструментом выделения.
ei-farstation-repair=Набор для ремонта сломанных дальних станций. Проведите им по станции, как обычным инструментом выделения.
ei-alien-beacon-repair=Набор для ремонта сломанных инопланетных маяков. Проведите им по маяку, как обычным инструментом выделения.
ei-gaia-pump=Морской насос, созданный для Геи.
ei-alien-flowers-1=Подозрительная инопланетная жизнь. Поставьте и [color=orange]расстреляйте[/color], чтобы получить добычу.

