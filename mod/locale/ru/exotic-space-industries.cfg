welcome=Добро пожаловать в Exotic Industries!
welcome-text=Это страница энциклопедии. Здесь вы найдёте сведения о моде, его возможностях и механиках. Новые открытия могут добавлять сюда новые статьи, так что время от времени заглядывайте. Если возникнут вопросы или проблемы, смело задавайте их на Discord-сервере мода — ссылка есть в описании мода на портале.
welcome-text-2=Вас ждёт множество новых машин, производственных цепочек и уникальных механик: какие-то попроще, какие-то посложнее. Обязательно изучите их!
game-related=Сведения об игровом процессе
game-related-text=В этом разделе собраны сведения об игровых возможностях и механиках мода. Он разбит на несколько подразделов — они в меню слева.
overall=Общие сведения
overall-text=Exotic Industries — глобальный мод, который затрагивает или полностью переделывает почти все аспекты ванильной Factorio. Разумеется, у Exotic Industries нет встроенной совместимости с другими крупными модами вроде Krastorio 2 или SE. Рекомендуемые моды, перечисленные в официальном модпаке, изначально совместимы с Exotic Industries. Для лучшего впечатления советуем использовать их вместе с любыми модами на удобство по вашему вкусу. Перед началом новой игры обязательно загляните в настройки мода: с их помощью можно подстроить важные аспекты.
biters=Кусаки и враги
biters-text=Враги играют в Exotic Industries второстепенную роль. В ранней игре они могут стать угрозой, если вы строите очень медленно и не следите за загрязнением. Но поскольку мод не добавляет новых или более сильных врагов, справляться с кусаками по ходу игры становится всё проще. В поздней игре вам будут доступны разнообразные мощные военные средства. Поэтому имеет смысл заранее увеличить стартовую зону. В официальном модпаке рекомендованы моды на базы кусак.
ages-and-tech=Эпохи технологий
ages-and-tech-text=Exotic Industries охватывает несколько технологических эпох. У каждой эпохи свои особенности и механики.
ages-and-tech-2=Тёмная, паровая, электрическая, компьютерная, квантовая и экзотическая эпохи
ages-and-tech-text-2=На эти шесть эпох разделён мод. Тёмная эпоха очень короткая и подводит вас к первой паровой фабрике. Нефть доступна рано и годится как источник топлива или средство защиты от кусак. С постройкой первых электронных устройств начинается эпоха электричества. Открываются разные источники энергии. В этой же эпохе появляются боты и ядерное деление. Компьютерная эпоха приносит маяки и модули. Высокотехнологичные машины станут доступны в квантовую эпоху. И наконец, экзотическая эпоха позволит вам победить в игре.
tech=Изменения в технологиях
tech-text=Exotic Industries меняет порядок исследования технологий. Новую эпоху можно исследовать, только если заранее изучен определённый процент технологий предыдущей эпохи. Кроме того, изменена стоимость технологий: все они начинаются с минимальной цены исследования и дорожают по мере продвижения по дереву. Это позволяет при желании быстро добраться до нужных технологий. Масштабирование стоимости и минимальное/максимальное значения настраиваются в настройках мода. Учтите, что форма кривой влияет не на цену последней технологии, а на характер роста к ней. Если вы играете в EI впервые, оставьте линейное масштабирование. Если хотите использовать множитель науки, НЕ применяйте ванильный — воспользуйтесь настройками мода.
tech-output=Прогресс текущей эпохи
tech-output-text=Следующая эпоха, к которой нужно перейти, — [font=default-bold]__3__[/font]. На данный момент исследовано [font=default-bold]__1__ / __2__[/font] процентов технологий, необходимых для её открытия.
world-gen-related=Сведения о мире
world-gen-related-text=В этом разделе собраны сведения о генерации мира и связанных механиках. Он разбит на несколько подразделов — они в меню слева.
resources=Новая система ресурсов
resources-text=Exotic Industries вводит новую систему ресурсов. Вместо одних лишь рудных месторождений ресурсы разделены на несколько категорий.
stone=Камень
stone-text=Камень — самый распространённый ресурс в игре. Отдельных месторождений у него нет: камень добывается где угодно с помощью [color=orange]каменного карьера[/color] [item=ei-stone-quarry][item=ei-electric-stone-quarry]. Кроме того, игрок может собирать камень вручную.
surface-patches=
surface-patches-text=
veins=Глубокие рудные жилы
veins-text=Рудные жилы становятся доступны только в поздней игре — с помощью [color=orange]глубинных буровых[/color] [item=ei-deep-drill]. Они дают высокий выход и лучшее соотношение при плавке. К тому же некоторые материалы — уран, свинец, золото и неодим — добываются только из этих жил.
artifacts=Инопланетные артефакты
artifacts-text=Часть артефактов осталась от древней цивилизации, умевшей обуздывать экзотическую материю. Их находки разбросаны по всему миру. Некоторые до сих пор работают.
actifacts-text-2=Но будьте осторожны: возможно, их не трогали не просто так...
gate=Межпространственные врата
gate-text=Врата позволяют переносить объекты сквозь пространство. Сами врата потребляют до [color=orange]50 МВт[/color], которые нужно обеспечивать для их работы. Падение ниже этого значения отключит врата. Переносить можно только неживые объекты. При этом для успешной передачи предметов выход врат должен быть направлен на любой [color=orange]контейнер[/color][item=wooden-chest][item=iron-chest]. Перенос предметов расходует энергию из внутреннего накопителя врат.
drone=Порт дронов
drone-text=Порт дронов позволяет взять под управление [color=blue]дрона[/color][entity=ei-drone]. При постройке здания создаётся связанный с ним дрон, которого можно увидеть, щёлкнув по порту. Оттуда можно установить связь с дроном и управлять им. Дрон летает над местностью, ставит и разбирает здания, перекладывает предметы в собственный инвентарь и обратно. Однако сражаться он не умеет. В любой момент можно отсоединиться от дрона кнопкой [color=orange]ВЫХОД[/color] или вернуть его на станцию кнопкой возврата [color=orange]СБРОС[/color]. Полёт дрона сквозь врата запускает перенос.
repair=Ремонт артефактов
repair-text=Сломанные инопланетные артефакты можно чинить, изготовив [color=blue]наборы для ремонта артефактов[/color][item=ei-crystal-accumulator-repair][item=ei-farstation-repair][item=ei-alien-beacon-repair]. После этого артефакты снова заработают. Ремонт запускается перетаскиванием набора по артефакту. Учтите, что набор при этом расходуется.
alien=Древние инопланетные данные
knowledge-text=Древняя цивилизация, оставившая артефакты, оставила после себя и часть своих данных.
new-logistics=Новая логистика
new-logistics-text=Exotic Industries добавляет и новые логистические возможности. Они разбиты на несколько подразделов — они в меню слева.
train-progression=Развитие поездов
train-progression-text=Поезда доступны уже с паровой эпохи. Сначала можно построить только простой [color=orange]паровоз[/color] [item=ei-steam-basic-locomotive], перевозящий предметы, но не жидкости. Улучшенный [color=orange]продвинутый паровоз[/color] [item=ei-steam-advanced-locomotive] умеет возить и жидкости. Оба поезда работают на горючем топливе вроде угля. Позже потребуется [color=brown]дизельное топливо[/color] [item=ei-diesel-fuel-unit] для более совершенных [color=orange]дизельных локомотивов[/color] [item=locomotive].
spidertron=Изменения паукотрона
spidertron-text=В отличие от ванильной игры, паукотрон доступен рано — в компьютерную эпоху. Однако ему нужно топливо. В начале вполне подойдёт горючее топливо, а позже ядерное или термоядерное даст паукотрону хорошие бонусы к скорости и ускорению. Кроме того, моды [color=green]Spidertron Patrols[/color] и [color=green]Constructron-Continued[/color] имеют особую интеграцию с этими изменениями.
cranes-and-belts=Новые конвейеры и краны-манипуляторы
cranes-and-belts-text=Exotic Industries добавляет новый уровень конвейеров — [color=orange]нео-конвейер[/color] [item=ei-neo-belt] из высокотехнологичных материалов с пропускной способностью 90 предметов/с. Также мод добавляет новые большие манипуляторы, называемые [color=orange]кранами[/color] [item=ei-big-inserter]. Ими удобно разгружать поезда на высокой скорости или перекладывать предметы между сундуками и складами.
bots=Больше ботов
bots-text=Если вы играете с модом Exotic Industries Bots, вам будут доступны специализированные и улучшенные роботы, а также новый робопорт.
new-mechanics=Новые игровые механики
new-mechanics-text=Exotic Industries добавляет множество новых механик. Они разбиты на несколько подразделов — они в меню слева.
beacon-overhaul=Переработка маяков
beacon-overhaul-text=Exotic Industries ограничивает число маяков, одновременно влияющих на одну машину, максимум четырьмя. Кроме того, маякам теперь нужна охлаждающая жидкость. Зато они вмещают больше модулей, а улучшенный маяк считается за два маяка в этом лимите, но вмещает ещё больше модулей.
specialised-pipes=Особые трубы и кабели данных
specialised-pipes-text=Exotic Industries добавляет особые трубы и кабели данных. [color=orange]Изолированные трубы[/color] служат для транспортировки очень холодных [fluid=ei-liquid-oxygen][fluid=ei-liquid-nitrogen] или очень горячих [fluid=ei-heated-helium-3] жидкостей, чтобы они оставались в жидкой фазе: в обычных трубах такие жидкости перешли бы в газообразное состояние. [color=orange]Кабели данных[/color] передают данные между машинами. Они нужны для работы новых машин — [color=orange]компьютера[/color] [item=ei-computer-core] и [color=orange]квантового компьютера[/color] [item=ei-quantum-computer].
space-destinations=Точки назначения в космосе
space-destinations-text=[color=orange]Ракетная шахта[/color] [item=rocket-silo] позволяет отправлять груз к разным точкам назначения. Когда она впервые открывается в компьютерную эпоху, вы сможете отправлять спутники только на [color=green]орбиту Наувиса[/color]. В зависимости от типа отправленного спутника или груза вы получите данные либо другие полезные продукты запуска.
space-destinations-2=Разные точки назначения
space-destinations-2-text=По мере продвижения станут доступны разные точки как внутри вашей звёздной системы, так и за её пределами. Чем дальше выбранная точка, тем больше нужно ракетного топлива. Кроме того, часть точек сначала нужно открыть — отправив специальный [color=orange]исследовательский спутник[/color] [item=ei-exploration-satellite] либо случайно, при запуске ракеты с обычным грузом. Некоторые новые точки находятся в дальнем космосе, [color=purple]за пределами солнечной системы[/color]. Учтите: даже при отправке исследовательских спутников открытие новых точек всегда зависит от случая.
induction-matrix=Индукционная матрица
induction-matrix-text=[color=orange]Индукционная матрица[/color] — составная машина для хранения больших объёмов энергии. Она накапливает избыток мощности, как обычные аккумуляторы, и отдаёт его позже. Разные уровни размера матрицы открываются соответствующими технологиями.
induction-matrix-2=Компоненты индукционной матрицы
induction-matrix-2-text=Индукционная матрица собирается из нескольких компонентов. [color=orange]Ядро индукционной матрицы[/color] [item=ei-induction-matrix-core] — её главный элемент. [color=orange]Индукционные катушки[/color] [item=ei-induction-matrix-basic-coil][item=ei-induction-matrix-advanced-coil][item=ei-induction-matrix-superior-coil] хранят энергию. Их можно улучшать до более высоких уровней, а рядом с [color=orange]соленоидом матрицы[/color] [item=ei-induction-matrix-basic-solenoid] они получают бонус. Соленоиды эффективнее, когда стоят последовательно, но не переусердствуйте с ними. [color=orange]Преобразователи[/color] [item=ei-induction-matrix-basic-converter][item=ei-induction-matrix-advanced-converter][item=ei-induction-matrix-superior-converter] увеличивают объём мощности, передаваемой в матрицу и из неё.
exotic-stabilizers=Стабилизаторы экзотической материи
exotic-stabilizers-text=Экзотическую материю очень трудно обрабатывать. Для этого нужна особая машина, выдерживающая её высокую энергию, — [color=orange]сборочный автомат экзотической материи[/color] [item=ei-exotic-assembler]. Но даже эти машины временами нестабильны и могут взорваться. Чтобы этого не происходило, расставьте вокруг автомата [color=orange]стабилизаторы экзотической материи[/color] [item=ei-matter-stabilizer]. Возможно, некоторые из них удастся найти прямо в мире.
black-hole=Генератор на чёрной дыре
black-hole-text=Могучий [color=orange]генератор на чёрной дыре[/color] — машина, способная обуздать энергию самой материи. Постройка этой машины и вывод её в [color=green]полностью работоспособное[/color] состояние приносят победу в игре. Чтобы реактор заработал, понадобится изрядное количество стройматериалов, бесперебойная подача расходуемой материи и много энергии. Поэтому заранее позаботьтесь о хорошей инфраструктуре [color=orange]термоядерных реакторов[/color] или мощной сети [color=orange]индукционных матриц[/color].
black-hole-2=Компоненты реактора
black-hole-2-text=Конструкция генератора собирается из нескольких компонентов. [color=orange]Генератор на чёрной дыре[/color] [item=ei-black-hole] — главное необходимое здание: после активации он поглощает любые предметы из своего инвентаря и добавляет их к внутреннему [color=green]запасу массы[/color]. Масса внутри чёрной дыры со временем убывает. Тип предмета при этом не важен — каждый даёт одинаковую прибавку массы. [color=orange]Пилоны-инжекторы энергии[/color] [item=ei-energy-injector-pylon] помогают удерживать активным поле сдерживания чёрной дыры. Каждый пилон потребляет 5 ГВт, однако на этапе запуска пилоны не нужны: чёрная дыра ещё мала, и её удерживает сам корпус реактора. [color=orange]Пилоны-отборщики энергии[/color] [item=ei-energy-extractor-pylon] могут извлекать до 100 ГВт каждый. Это возможно только в полностью работоспособном состоянии чёрной дыры.
black-hole-3=Этапы чёрной дыры
black-hole-3-text=Чтобы реактор заработал, нужно пройти несколько шагов. На этапе запуска пилоны не требуются — достаточно набрать начальную массу [color=blue]10x10^3 кг[/color]. По достижении 100% прогресса этапа генератор переходит к следующему состоянию. Для дальнейшего продвижения теперь постоянно должны быть активны [color=blue]8 пилонов-инжекторов[/color] [item=ei-energy-injector-pylon]. Нажатие кнопки расширения запускает рост радиуса чёрной дыры. В этом состоянии реактор должен проработать [color=blue]60 с[/color], чтобы выйти в полностью работоспособное состояние. С этого момента [color=orange]пилоны-отборщики энергии[/color] [item=ei-energy-extractor-pylon] в радиусе действия могут забирать энергию из машины и отдавать её в вашу сеть. Поскольку выходная мощность огромна, генератор теперь практически самодостаточен и требует лишь постоянной подачи массы.
nuclear-fission-and-fusion=Деление и синтез ядер
nuclear-fission-and-fusion-text=Exotic Industries добавляет ряд новых возможностей для ядерной энергетики. Они разбиты на несколько подразделов — они в меню слева.
fission-reactors=Изменения ядерного деления
fission-reactors-text=Энергетика на делении ядер в этом моде изменена. [color=orange]Ядерный реактор[/color] [item=nuclear-reactor] больше не получает бонус соседства, но выдаёт больше энергии. Уран добывать сложнее, чем в ванильной игре. Переработка отработанных топливных элементов позволяет использовать продукты деления в новых элементах, повышая эффективность. С [color=brown]ядерными отходами[/color] [item=ei-nuclear-waste] придётся что-то делать.
fission-reactors-2=Высокотемпературное деление
fission-reactors-2-text=[color=orange]Высокотемпературный ядерный реактор[/color] [item=ei-high-temperature-reactor] — новый реактор деления, дающий ещё больше энергии. Разогретый до рабочей температуры и снабжённый огромными объёмами воды и топливным стержнем, он производит большие объёмы пара эффективнее теплообменников. Он способен работать даже на [color=brown]тории[/color] [item=ei-thorium-232-fuel], который сам по себе не делится.
fusion-power=Термоядерная энергетика
fusion-power-text=[color=orange]Термоядерный реактор[/color] [item=ei-fusion-reactor] — новая машина, вырабатывающая огромное количество энергии за счёт слияния лёгких атомов. Охлаждается контуром [color=orange]свинцового теплоносителя[/color] [fluid=ei-cold-coolant][fluid=ei-hot-coolant]. Однако реактор довольно дорог в постройке и требует постоянной подачи топлива. Поначалу лучшие варианты топлива — [color=blue]литий[/color] и [color=blue]протий[/color]. Позже можно использовать [color=blue]дейтерий[/color] и [color=blue]тритий[/color] или даже [color=blue]гелий-3[/color].
fusion-power-2=Нейтроны и вы
fusion-power-2-text=Чтобы получать улучшенные виды термоядерного топлива, используются [color=green]нейтроны[/color]. Они образуются в источниках нейтронов при [color=green]делении[/color] и [color=green]синтезе[/color] ядер, и улавливать их нужно [color=orange]нейтронными коллекторами[/color] [item=ei-neutron-collector]. Количество полученных нейтронов зависит от интенсивности источника и расстояния до коллектора.
