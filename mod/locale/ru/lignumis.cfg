[mod-setting-description]
lignumis-lab=Переносит рецепт конвейера в исследование логистики и использует деревянные конвейеры в рецепте лаборатории, чтобы её можно было собрать при высадке на Наувис.
lignumis-double-rocket=Временная ракета сможет перевозить 80 слотов вместо 40.
lignumis-sciences-spoil=Для дополнительной сложности деревянные и паровые исследовательские пакеты будут портиться.
lignumis-infinite-astroponics-productivity-research=Исследование производительности астропоники становится бесконечным вместо ограничения на 5-м уровне (что даёт 50% производительности).
lignumis-electric-lumber-mill=Лесопилка будет потреблять электричество вместо топлива и откроется после исследования электричества.
lignumis-k2so-gold-tech-card=Технологии поздней игры, которые требовали бы деревянных и паровых исследовательских пакетов, вместо этого потребуют золотые технокарты, изготовленные из золота Лигнумиса. Требует включённых прогрессивных технологий.

