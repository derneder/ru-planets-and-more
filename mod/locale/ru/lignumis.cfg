[tips-and-tricks-item-description]
lignumis-briefing=[planet=lignumis] — луна [planet=nauvis], с которой нужно сбежать, чтобы получить доступ к более продвинутым технологиям. Основные ресурсы: [item=wood], [item=gold-ore], [item=peat] и [item=stone]. На луне нет железа и меди, поэтому ваши возможности сильно ограничены, а единственный доступный металл — на первый взгляд не самое ценное [item=gold-ore]. Электричество будет открыто только после побега.\n\n[img=utility/warning_icon] Лигнумис влияет и на остальную игру, изменяя ванильные рецепты и технологии. Загляните в настройки мода, чтобы подстроить их под себя. Либо установите Director's Cut с портала модов, чтобы получить полный опыт.
lignumis-burner-agriculture=Снабжать сельскохозяйственные башни одновременно семенами и топливом сложнее, чем их продвинутые электрические аналоги. Из-за ограничения движка манипуляторы будут продолжать хватать семена, игнорируя топливо, если оно на неправильной стороне конвейера. Используйте схемы или несколько манипуляторов, чтобы полностью избежать таких проблем.
lignumis-noise=Местные жители [planet=lignumis] чувствительны к [img=airborne-pollutant/noise] громким звукам. Всё механическое, что вы создаёте, потенциально довольно шумное. Держите базу компактной и ставьте стены, чтобы шум оставался внутри.\nЧем можно снизить уровень шума: [img=item/wooden-wall] стены, [img=entity/tree-01] деревья, [img=item/efficiency-module] модули эффективности, [item=active-noise-cancelling-tower].
lignumis-steam=С [entity=steam-assembling-machine] и [entity=steam-inserter] вы получаете новые инструменты для более быстрых и компактных производственных цепочек. Из-за отсутствия лучших технологий сжигание [item=moist-stromatolite-remnant] в [entity=desiccation-furnace] — ваш единственный источник [fluid=steam]. Балансируйте пар, сжигая излишки влажных остатков строматолита в обычных печах.\n\n[img=utility/warning_icon] Производства [fluid=steam] не хватит, чтобы обеспечить всю базу. По возможности сохраняйте старые топливные схемы.
lignumis-escaping=[entity=provisional-rocket-silo] позволяет взять с собой солидный запас. Берите в основном инфраструктурные предметы, чтобы быстро стартовать на Наувисе. Топливо, золото и исследовательские пакеты оставьте.\n\n[img=utility/warning_icon] Хотя исследовать всё перед отлётом не обязательно, это хорошая идея. Или хотя бы убедитесь, что сможете продолжать исследования после отлёта.\n[img=utility/warning_icon] Ваша база продолжит шуметь и без вас. К тому же враги продолжат расширяться. Позаботьтесь о защите базы перед отлётом.

