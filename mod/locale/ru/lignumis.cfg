[mod-description]
lignumis=Погрузитесь в мир Лигнумиса — луны Наувиса, предлагающей лишь самые базовые технологии.\n\nЭто версия, отражающая изначальный замысел автора мода. Если хотите более изолированного опыта планетного мода, установите обычную версию.


