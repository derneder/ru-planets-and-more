[mod-setting-name]
auto-deconstruct=Автоматический снос
no-tiles=Не добавлять новые тайлы

[mod-setting-description]
auto-deconstruct=Автоматически помечает сущность на снос, когда тайл под ней помечен для выемки грунта.
no-tiles=В Factorio есть ограничение в 255 прототипов тайлов. Некоторые моды, такие как Alien Biomes, добавляют огромное количество тайлов, из-за чего можно упереться в лимит 255. По умолчанию этот мод добавляет два тайла: «Выемочный» и «Выкопанный». При включении этой настройки мод переиспользует «Жёлтый улучшенный бетон» для «Выемочного» и «Коричневый улучшенный бетон» для «Выкопанного». Если никакой другой используемый мод не меняет эти два типа тайлов, эта настройка — чисто косметическая.

[item-name]
canex-excavator=Экскаватор
canex-digable=Выемочная поверхность

[item-description]
canex-excavator=Выкапывает поверхности, подготовленные с помощью [item=canex-digable], чтобы могла течь вода. Подробнее смотрите в разделе «Советы и хитрости».
canex-digable=Помечает грунт как пригодный для выемки с помощью [item=canex-excavator].

[recipe-name]
canex-excavator=Экскаватор
canex-digable=Выемочная поверхность

