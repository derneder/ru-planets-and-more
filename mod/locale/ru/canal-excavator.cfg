canex-rsc-digable-surface=Создаётся при размещении [item=canex-digable] __1__.
canex-on=на __1__
canex-in=в __1__

[tile-name]
canex-digable=Тайл выемочной поверхности
canex-dug=Выкопанная поверхность

[tile-description]
canex-dug=Тайл, который при соприкосновении с водой сам превращается в воду (или аналогичный тайл на других планетах, например в лаву на Вулканусе).

[technology-name]
canex-excavator=Канальный экскаватор

[technology-description]
canex-excavator=Позволяет прокладывать водные каналы.

[story]
canex-already-dug=Тайл уже выкопан
canex-remaining=Осталось: __1__
canex-dug=Переход через: __1__
canex-invalid-surface=Невозможно копать на этой поверхности
canex-not-on-landfill=Нельзя выкапывать отсыпку
canex-not-in-water=Нельзя выкапывать воду

[command]
canex-transition-dug=Принудительно запускает переход для всех тайлов, зарегистрированных на переход. Может исправить случаи, когда переход был почему-то пропущен.
canex-reset-partially-dug=Все частично выкопанные, но затем отменённые тайлы хранятся в таблице, которая может сильно разрастись при частых отменах. Эта команда очищает её.
canex-debug=[surfaceName] — показывает состояние всех выкопанных, зарегистрированных на переход и частично выкопанных тайлов.
canex-show-surface-config=[surfaceName] — показывает конфигурацию одной или всех поверхностей.
canax-remove-floating=Удаляет все ресурсы выемки, под которыми нет выемочного тайла. Такое может произойти, если другой мод удаляет тайл, не уведомив об этом данный мод.

[tips-and-tricks-item-description]
canex-excavator-tnt=Чтобы построить [entity=canex-excavator], сначала нужно уложить тайлы [item=canex-digable] и построить экскаватор поверх них.
canex-canals-tnt=После того как [entity=canex-excavator] извлечёт все ресурсы из [item=canex-digable], выкопанные тайлы рядом с источником воды превратятся в водные тайлы.\nМожно выкапывать не только каналы с [tile=water] — тип воды копируется от источника.
canex-canals-sa-tnt=\nНа разных планетах добыча может давать разные результаты. Например, выемка на [planet=gleba] даёт [item=spoilage].

[tips-and-tricks-item-name]
canex-excavator-tnt=Постройка канального экскаватора
canex-canals-tnt=Выемка каналов

[se]
canex-vita-zones=зоны витамеланжа
canex-frozen-zones=замороженные зоны
canex-rocky-zones=каменистые зоны
