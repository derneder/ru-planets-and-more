[mod-name]
Cerys-Moon-of-Fulgora=○ Церис, луна Фульгоры

[mod-description]
Cerys-Moon-of-Fulgora=Луна-головоломка Фульгоры. Древние обломки, вмёрзшие в толстый лёд, можно попытаться починить — включая колоссальный ядерный реактор, способный изменить возможности на поверхности... если получится его запустить. Мод не изменяет ванильную игру, поэтому легко добавляется в существующие сохранения.
