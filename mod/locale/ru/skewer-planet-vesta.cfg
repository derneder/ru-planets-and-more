[technology-description]
dt-fuel=Дейтериево-тритиевая смесь служит катализатором для целого ряда плазменных реакций.
hot-lithium-production=Тепло как катализатор запускает в литии реакцию, позволяющую извлекать тритий.
tritium-production=Тритий — важный продукт для процессов на основе плазмы.
hot-heavy-water-production=Нагрев тяжёлой воды и сероводорода позволяет легко извлекать дейтерий.
deuterium-production=Дейтерий — важный продукт для процессов на основе плазмы.
s1_cluster_processing=На ближайших камнях обнаружены кальцинированные следы железа и меди. Судя по всему, на камнях живёт разновидность водорослей, откладывающая распространённые металлы в кристаллической форме.
s1_ammonia_chilled_plate=Сталь и железо, нагретые вместе и резко охлаждённые, дают сплав, выдерживающий экстремальные температуры.
s1_brine=Превращение воды в рассол — важный шаг к производству газообразного трития. Хм, где-то я уже видел этот процесс...
s1_exotic_algae=Можно изучить больше рецептов с экзотическими водорослями.
s1_iridium_plate=Иридиевая пластина выдерживает экстремальные температуры, возникающие при намагничивании.
s1_nutrients_from_co2=Углекислый газ, судя по всему, создаёт наиболее благоприятную среду для микроорганизмов Весты.
s1_vestan_char=Углерод можно дополнительно нагреть и переработать в материал, который легче горит.
s1_sandceramicmesh=Иногда, чтобы добиться большого, нужно начать с малого. С сокрушительно малого.

